<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARMOR LAB</title>
<style>
  :root{
    --bg:#0a0c0f; --fg:#c8d2dc; --dim:#5a6672; --accent:#e8541f; --line:#1b2128;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font:11px/1.5 var(--mono);letter-spacing:.06em;overflow:hidden}
  canvas{display:block;position:fixed;inset:0;touch-action:none}
  /* 移动端紧凑布局：390px 宽的屏幕放不下桌面版 HUD */
  @media (max-width:820px){
    html,body{font-size:10px}
    .hd h1{font-size:11px;letter-spacing:.24em}
    #tele{top:10px;right:12px;min-width:0}
    #tele .perf{display:none}          /* 性能读数在手机上不是重点 */
    #roster{left:12px;top:56px}
    #roster #rosterList{display:flex;gap:6px}
    #roster .item img{width:26px;height:32px;margin-left:4px}
    #roster .nm{font-size:10px}
    #roster .sub,#roster .no{display:none}
    #inspect{left:12px;top:120px;max-width:min(58vw,220px);padding-left:9px}
    #inspect .insName{font-size:13px}
    #ctl{left:12px;right:12px;bottom:12px;gap:8px}
    #views,#ctl .grp{flex-wrap:wrap}
    button{padding:7px 9px}            /* 触摸目标不小于约 30px */
    input[type=range]{width:min(46vw,190px)}
    #scrimL{width:60vw;height:44vh}
    #scrimR{width:44vw;height:30vh}
    #scrimB{width:100vw;height:26vh}
  }
  .panel{position:fixed;z-index:2}
  /* 幽灵态下模型会压到遥测文字上，加一层与背景同色的柔和衬底保证可读性 */
  .scrim{position:fixed;z-index:1;pointer-events:none}
  #scrimR{top:0;right:0;width:320px;height:340px;
    background:radial-gradient(120% 100% at 100% 0%,
      rgba(10,12,15,.94) 0%, rgba(10,12,15,.80) 45%, rgba(10,12,15,0) 100%)}
  #scrimL{top:0;left:0;width:340px;height:400px;
    background:radial-gradient(120% 100% at 0% 0%,
      rgba(10,12,15,.94) 0%, rgba(10,12,15,.80) 45%, rgba(10,12,15,0) 100%)}
  #scrimB{bottom:0;left:0;width:560px;height:170px;
    background:linear-gradient(0deg, rgba(10,12,15,.92) 0%, rgba(10,12,15,0) 100%)}
  .lbl{color:var(--dim);font-size:9px;letter-spacing:.18em}
  .val{font-size:13px;color:var(--fg)}
  .hd{position:fixed;top:16px;left:20px;z-index:2}
  .hd h1{margin:0;font-size:12px;font-weight:400;letter-spacing:.3em}
  .hd .sub{color:var(--dim);font-size:9px;letter-spacing:.18em;margin-top:4px}

  #tele{top:16px;right:20px;text-align:right;min-width:150px}
  #tele .row{display:flex;justify-content:space-between;gap:16px;padding:2px 0}
  #tele .row span:first-child{color:var(--dim);font-size:9px;letter-spacing:.14em}
  #tele .sect{margin-top:10px;padding-top:6px;border-top:1px solid var(--line)}

  #ctl{bottom:18px;left:20px;display:flex;flex-direction:column;gap:12px}
  .grp{display:flex;gap:4px;align-items:center}
  button{background:transparent;border:1px solid var(--line);color:var(--dim);
    font:inherit;letter-spacing:.12em;padding:5px 9px;cursor:pointer}
  button:hover{border-color:var(--dim);color:var(--fg)}
  button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
  input[type=range]{width:190px;accent-color:var(--accent)}
  #roster{left:20px;top:74px;display:none}
  #roster .item{display:flex;gap:9px;align-items:center;padding:5px 6px 5px 0;
    cursor:pointer;border-left:1px solid transparent}
  #roster .item:hover{border-left-color:var(--dim)}
  #roster .item[aria-current="true"]{border-left-color:var(--accent)}
  #roster .item img{width:34px;height:42px;object-fit:cover;background:#12161b;
    padding-left:0;margin-left:8px;filter:saturate(.85)}
  #roster .item[aria-current="true"] img{filter:none}
  #roster .no{color:var(--dim);font-size:9px;width:16px;text-align:right}
  #roster .nm{font-size:12px;letter-spacing:.14em}
  #roster .sub{color:var(--dim);font-size:9px;letter-spacing:.1em}
  #roster .item[aria-current="true"] .nm{color:var(--accent)}
  #inspect{left:20px;top:70px;display:none;min-width:210px;max-width:260px;
    border-left:1px solid var(--accent);padding:2px 0 2px 12px}
  #inspect .insName{font-size:15px;letter-spacing:.18em;margin:2px 0 8px;color:var(--fg)}
  #inspect .r{display:flex;justify-content:space-between;gap:14px;padding:1px 0}
  #inspect .r span:first-child{color:var(--dim);font-size:9px;letter-spacing:.14em}
  #inspect .mats{color:var(--dim);font-size:9px;margin-top:6px;line-height:1.6;
    word-break:break-all}
  #inspect .emis{color:var(--accent)}
  #insClose{margin-top:10px}
  canvas{cursor:default}
  canvas.pickable{cursor:pointer}
  #load{position:fixed;inset:0;z-index:9;background:var(--bg);display:grid;
    place-content:center;text-align:center;gap:8px;transition:opacity .4s}
  #load.done{opacity:0;pointer-events:none}
  #loadName{font-size:17px;letter-spacing:.26em}
  #loadStage{margin-top:4px}
  #bar{width:220px;height:1px;background:var(--line);margin:0 auto}
  #bar i{display:block;height:100%;width:0;background:var(--accent)}
  #err{color:var(--accent);max-width:60ch;text-align:left;white-space:pre-wrap}
</style>
</head>
<body>
<div class="panel" id="roster">
  <div class="lbl">ARMOR ARCHIVE</div>
  <div id="rosterList"></div>
</div>

<div class="scrim" id="scrimL"></div>
<div class="scrim" id="scrimR"></div>
<div class="scrim" id="scrimB"></div>

<div class="hd">
  <h1>ARMOR LAB</h1>
  <div class="sub" id="modelName">—</div>
</div>

<div class="panel" id="tele">
  <div class="row"><span>AZIMUTH</span><span class="val" id="az">0.0°</span></div>
  <div class="row"><span>ELEVATION</span><span class="val" id="el">0.0°</span></div>
  <div class="row"><span>ORTHO ZOOM</span><span class="val" id="zm">1.00</span></div>
  <div class="row"><span>EXPLODE</span><span class="val" id="ex">0%</span></div>
  <div class="row"><span>MOTION</span><span class="val" id="mo">IDLE</span></div>
  <div class="sect perf">
    <div class="row"><span>FPS</span><span class="val" id="fps">—</span></div>
    <div class="row"><span>TRIANGLES</span><span class="val" id="tri">—</span></div>
    <div class="row"><span>DRAW CALLS</span><span class="val" id="dc">—</span></div>
    <div class="row"><span>SOURCE</span><span class="val" id="sc">—</span></div>
    <div class="row"><span>GROUPS</span><span class="val" id="gc">—</span></div>
    <div class="row"><span>PARTS</span><span class="val" id="pc">—</span></div>
    <div class="row"><span>LOAD</span><span class="val" id="lt">—</span></div>
  </div>
</div>

<div class="panel" id="ctl">
  <div class="grp" id="views"></div>
  <div class="grp"><span class="lbl">MODE</span><span id="modes" style="display:inline-flex;gap:4px"></span></div>
  <div class="grp">
    <span class="lbl">EXPLODE</span>
    <input type="range" id="slider" min="0" max="1" step="0.001" value="0">
    <button id="btnParts" aria-pressed="false">PARTS</button>
    <button id="btnAssemble">ASSEMBLE</button>
    <button id="btnDebris" aria-pressed="false">DEBRIS</button>

  </div>
</div>

<div class="panel" id="inspect">
  <div class="lbl" id="insKicker">SUBASSEMBLY</div>
  <div class="insName" id="insName">—</div>
  <div id="insRows"></div>
  <button id="insClose">CLOSE  ESC</button>
</div>

<div id="load">
  <div class="lbl" id="loadKicker">ARMOR ARCHIVE</div>
  <div class="val" id="loadName">—</div>
  <div id="bar"><i></i></div>
  <div class="lbl" id="loadStage">INITIALIZING</div>
  <div class="val" id="pct">00%</div>
  <div id="err"></div>
</div>

<script type="importmap">
{"imports":{
  "three":"./node_modules/three/build/three.module.js",
  "three/addons/":"./node_modules/three/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

// 模型清单由 scripts/build_index.py 生成，不写死在前端
let MODELS = ['hulkbuster', 'ironman'];   // index.json 加载前的兜底
let MODEL_INDEX = [];
async function loadIndex() {
  try {
    const r = await fetch('./assets/manifests/index.json');
    if (!r.ok) return;
    MODEL_INDEX = (await r.json()).models || [];
    if (MODEL_INDEX.length) MODELS = MODEL_INDEX.map((m) => m.slug);
  } catch { /* 用兜底清单 */ }
}
const params = new URLSearchParams(location.search);
const slug = params.get('model') || MODELS[0];
const srcPref = params.get('src') || 'auto';   // auto | raw | meshopt | draco

// 优先用压缩产物：读 dist/index.json（由 compress_models.mjs 生成）挑体积最小的。
// 哪种编码更小取决于模型 —— hulkbuster 上 draco 明显更好，ironman 上 meshopt 更好，
// 所以不能写死顺序。缺失则回退到未压缩的 scene.gltf。
async function resolveSource(name) {
  const raw = { url: `./assets/raw/${name}/scene.gltf`, mode: 'raw', bytes: 0 };
  if (srcPref === 'raw') return raw;
  let index = null;
  try {
    const r = await fetch(`./assets/dist/${name}/index.json`);
    if (r.ok) index = await r.json();
  } catch { /* 无压缩产物，回退 */ }
  if (!index || !Object.keys(index).length) return raw;

  const pick = srcPref === 'auto'
    ? Object.entries(index).sort((a, b) => a[1] - b[1])[0]
    : (index[srcPref] !== undefined ? [srcPref, index[srcPref]] : null);
  if (!pick) return raw;
  return { url: `./assets/dist/${name}/model.${pick[0]}.glb`, mode: pick[0], bytes: pick[1] };
}
const $ = (id) => document.getElementById(id);

// ---------- 视角预设：单位球方向 ----------
const VIEWS = {
  ISO:   [ 1,  0.75,  1],
  '3/4F':[ 0.6, 0.35, 1],
  FRONT: [ 0,  0,     1],
  SIDE:  [ 1,  0,     0],
  PLAN:  [ 0,  1,     0.001],
  REAR:  [ 0,  0.2,  -1],
};

function showFatal(msg, detail) {
  const el = $('err');
  if (el) el.textContent = msg + (detail ? '\n\n' + detail : '');
  const pct = $('pct');
  if (pct) pct.textContent = '—';
  $('load')?.classList.remove('done');
}

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  showFatal('这个浏览器无法创建 WebGL 上下文，页面需要 WebGL2。\n'
    + '可尝试：更新浏览器、在设置里启用硬件加速、或换一台设备。', String(e));
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.5;
document.body.appendChild(renderer.domElement);
// 显卡驱动重置或标签页长时间后台会丢上下文，静默变黑最难排查
renderer.domElement.addEventListener('webglcontextlost', (e) => {
  e.preventDefault();
  showFatal('WebGL 上下文丢失（通常是显卡驱动重置或标签页长时间后台）。\n刷新页面即可恢复。');
});

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0c0f);

// 正交相机：追求工程图观感，无透视畸变
const FRUSTUM = 1.5;
const FIT_MARGIN = 1.06;          // 取景留边（对角线取景已偏保守）
const ASSEMBLE_SECONDS = 4.2;     // 整条组装时间轴的时长
const ASSEMBLE_BACK = 1.08;       // 到位时的轻微过冲，读作机械咬合；过大会穿模
let aspect = innerWidth / innerHeight;
const camera = new THREE.OrthographicCamera(
  -FRUSTUM * aspect / 2, FRUSTUM * aspect / 2, FRUSTUM / 2, -FRUSTUM / 2, -50, 50);
camera.position.set(1, 0.75, 1).normalize().multiplyScalar(3);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 0, 0);
controls.enableZoom = false;   // 缩放自管：否则 controls 的 change 事件会把
                               // 我们自己的取景动画误判成用户输入，形成反馈环
renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  state.userZoom = THREE.MathUtils.clamp(
    state.userZoom * Math.pow(0.999, e.deltaY), 0.25, 8);
}, { passive: false });

// 技术制图式打光：主光 + 侧补光 + 顶部轮廓光，不用环境贴图
scene.add(new THREE.HemisphereLight(0x8fa8c0, 0x14181d, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(3, 5, 4); scene.add(key);
const fill = new THREE.DirectionalLight(0x88a4c8, 0.9); fill.position.set(-4, 1, -3); scene.add(fill);
const rim = new THREE.DirectionalLight(0xffd9c0, 0.7); rim.position.set(0, 4, -5); scene.add(rim);
// 跟随相机的补光：装甲是开放壳体，爆炸后会大量露出背光的内表面
const headlight = new THREE.DirectionalLight(0xdfe8f2, 1.4);
scene.add(headlight);

// ---------- 状态 ----------
const state = {
  explode: 0, targetExplode: 0, showDebris: false, userZoom: 1,
  mode: 'groupSpread',
  selected: null, drill: 0, targetDrill: 0, focus: -1,
  assembling: false, assembleT: 0,
  zoomFitDrill: 1, targetDrillPos: new THREE.Vector3(),
  zoomFit: 1, zoomFitFull: 1,
  targetAssembled: new THREE.Vector3(), targetFull: new THREE.Vector3(),
  viewDir: new THREE.Vector3(1, 0.75, 1).normalize(),
  tweening: false,
};
let parts = [];          // {obj, basePos, dirLocal, meta}
let baseObjs = [];       // 地面碎石
let root = null;
let plan = null;         // <slug>.explode.json
let groupIndex = {};     // "部位/左右" -> 组元数据
let partsByGroup = new Map();
let pickTargets = [];    // 可拾取的 Mesh
let emissiveMats = [];   // {mat, base} —— 组装收尾时点亮
let modelScale = 1;
let loadStart = performance.now();

// ---------- 加载 ----------
async function loadModel(name) {
  $('load').classList.remove('done');
  $('err').textContent = '';
  loadStart = performance.now();

  const disp = (MODEL_INDEX.find((m) => m.slug === name) || {});
  $('loadName').textContent = disp.name || name.toUpperCase();
  $('loadKicker').textContent = disp.subtitle ? `ARMOR ARCHIVE · ${disp.subtitle}` : 'ARMOR ARCHIVE';
  $('loadStage').textContent = 'READING DRAWING INDEX';
  const [manifest, explodePlan] = await Promise.all([
    fetch(`./assets/manifests/${name}.json`).then(r => {
      if (!r.ok) throw new Error(`manifest ${r.status}`); return r.json();
    }),
    fetch(`./assets/manifests/${name}.explode.json`).then(r => {
      if (!r.ok) throw new Error(`explode plan ${r.status}`); return r.json();
    }),
  ]);
  plan = explodePlan;
  state.mode = plan.defaultMode || 'groupSpread';

  $('loadStage').textContent = 'RESOLVING GEOMETRY SOURCE';
  const source = await resolveSource(name);
  $('loadStage').textContent = `STREAMING ${source.mode.toUpperCase()}`
    + (source.bytes ? ` · ${(source.bytes / 1048576).toFixed(2)} MB` : '');
  const loader = new GLTFLoader();
  const dracoLoader = new DRACOLoader();
  dracoLoader.setDecoderPath('./node_modules/three/examples/jsm/libs/draco/');
  loader.setDRACOLoader(dracoLoader);
  loader.setMeshoptDecoder(MeshoptDecoder);

  const gltf = await loader.loadAsync(source.url, (e) => {
    if (e.lengthComputable) {
      const p = e.loaded / e.total;
      $('pct').textContent = String(Math.round(p * 100)).padStart(2, '0') + '%';
      $('bar').firstElementChild.style.width = (p * 100) + '%';
    }
  });

  if (root) { scene.remove(root); disposeTree(root); }
  root = new THREE.Group();
  root.add(gltf.scene);
  scene.add(root);

  // 按 node 索引取对象 —— manifest 用索引做键，因为节点名有重复
  parts = []; baseObjs = [];
  for (const meta of manifest.parts) {
    const obj = await gltf.parser.getDependency('node', meta.node);
    if (!obj) continue;
    if (meta.flag === 'base') { baseObjs.push(obj); obj.visible = false; continue; }
    parts.push({ obj, meta, basePos: obj.position.clone(), dirLocal: new THREE.Vector3() });
  }

  // 归一化：以可用部件（不含碎石）的包围盒把模型缩放到高度 1、居中到原点
  root.updateMatrixWorld(true);
  const box = new THREE.Box3();
  for (const p of parts) box.expandByObject(p.obj);
  const size = new THREE.Vector3(); box.getSize(size);
  const center = new THREE.Vector3(); box.getCenter(center);
  modelScale = 1 / Math.max(size.y, 1e-6);
  root.scale.setScalar(modelScale);
  root.position.copy(center).multiplyScalar(-modelScale);
  root.updateMatrixWorld(true);

  $('loadStage').textContent = 'INDEXING SUBASSEMBLIES';
  buildVectors(gltf.scene);
  buildGroups();
  buildLocalBoxes();
  state.selected = null; state.drill = 0; state.targetDrill = 0;
  renderInspector();
  currentBox = box.clone(); currentCenter = center.clone();
  computeFraming(currentBox, currentCenter);
  buildModeButtons();
  buildRoster();

  const srcLabel = source.mode.toUpperCase() +
    (source.bytes ? ` ${(source.bytes / 1048576).toFixed(2)}MB` : '');
  $('modelName').textContent =
    `${name.toUpperCase()} · ${parts.length} PARTS · ${srcLabel}`;
  $('sc').textContent = srcLabel;
  document.title = `ARMOR LAB — ${name.toUpperCase()}`;
  window.__source = source;
  $('pc').textContent = parts.length;
  $('gc').textContent = Object.keys(plan.groups || {}).length;
  $('lt').textContent = Math.round(performance.now() - loadStart) + 'ms';
  $('tri').textContent = renderer.info.render.triangles.toLocaleString();
  applyDebris();
  $('loadStage').textContent = 'SYSTEM ONLINE';
  $('load').classList.add('done');

  window.__ready = true;
  window.__stats = {
    model: name, parts: parts.length, base: baseObjs.length,
    loadMs: Math.round(performance.now() - loadStart),
    geometries: renderer.info.memory.geometries,
    textures: renderer.info.memory.textures,
  };
}

// 位移向量以「模型高度的分数」为单位，且自带幅度，所以不能用会归一化的
// transformDirection。取矩阵的 3x3 线性部分，旋转与缩放一并正确带上。
function buildVectors(gltfScene) {
  const H = plan.height;
  const M = new THREE.Matrix4();
  const m3 = new THREE.Matrix3();
  for (const p of parts) {
    const entry = plan.parts[String(p.meta.node)];
    p.vecLocal = {};
    if (!entry) continue;
    p.assembleDelay = entry.assembleDelay ?? 0;
    M.copy(p.obj.parent.matrixWorld).invert().multiply(gltfScene.matrixWorld);
    m3.setFromMatrix4(M);
    for (const mode of plan.modes) {
      const v = entry[mode];
      if (!v) continue;
      p.vecLocal[mode] = new THREE.Vector3(v[0], v[1], v[2])
        .multiplyScalar(H).applyMatrix3(m3);
    }
  }
}

// 取景：分别算「装配态」与「完全爆炸态」需要的正交缩放和视点，帧循环里按进度插值
// 用包围盒对角线（即外接球直径）取景。取 max(w,d) 会低估斜视角下的投影宽度 ——
// 3/4 视角时对角方向的实际跨度可达 1.4 倍，导致零件被裁到画面外。
// 对角线是方向无关的上界，用户任意旋转都不会裁切。
function fitZoom(lo, hi) {
  const w = (hi[0] - lo[0]) * modelScale;
  const h = (hi[1] - lo[1]) * modelScale;
  const d = (hi[2] - lo[2]) * modelScale;
  const diag = Math.hypot(w, h, d);
  const need = Math.max(diag, diag / aspect) * FIT_MARGIN;
  return FRUSTUM / Math.max(need, 1e-6);
}

function computeFraming(assembledBox, assembledCenter) {
  const fit = fitZoom;
  const aLo = assembledBox.min.toArray(), aHi = assembledBox.max.toArray();
  state.zoomFit = fit(aLo, aHi);

  const fb = plan.boundsAtFull?.[state.mode];
  if (fb) {
    state.zoomFitFull = fit(fb.min, fb.max);
    // 爆炸后包围盒中心相对装配态中心的偏移，换算到世界空间
    const fc = new THREE.Vector3(
      (fb.min[0] + fb.max[0]) / 2, (fb.min[1] + fb.max[1]) / 2, (fb.min[2] + fb.max[2]) / 2);
    state.targetFull.copy(fc).sub(assembledCenter).multiplyScalar(modelScale);
  } else {
    state.zoomFitFull = state.zoomFit;
    state.targetFull.set(0, 0, 0);
  }
  state.targetAssembled.set(0, 0, 0);
}

const EMISSIVE_COLOR = new THREE.Color(0x7fd4ff);

function matList(mesh) {
  return Array.isArray(mesh.material) ? mesh.material : [mesh.material];
}

// 材质在多个节点间共享（hulkbuster 是 19 个材质配 155 个节点），
// 直接改会牵连其它零件，所以每个 mesh 克隆一份自己的。
// 贴图在克隆时按引用共享，不额外占显存。
function buildGroups() {
  groupIndex = plan.groups || {};
  partsByGroup = new Map();
  pickTargets = [];
  for (const p of parts) {
    const key = `${p.meta.part}/${p.meta.side}`;
    p.groupKey = key;
    if (!partsByGroup.has(key)) partsByGroup.set(key, []);
    partsByGroup.get(key).push(p);

    p.meshes = [];
    p.obj.traverse((n) => {
      if (!n.isMesh) return;
      n.material = Array.isArray(n.material)
        ? n.material.map((m) => m.clone()) : n.material.clone();
      n.userData.part = p;
      p.meshes.push(n);
      pickTargets.push(n);
    });

    if (p.meta.emissive) {
      for (const m of p.meshes) for (const mm of matList(m)) {
        if (!mm.emissive) continue;
        mm.emissive.copy(EMISSIVE_COLOR);
        mm.emissiveIntensity = 2.4;
      }
    }
  }

  // 发光材质：manifest 标记的（hulkbuster 的 light 系材质），
  // 以及自带 emissive 贴图的（ironman 的方舟反应堆）。
  // 组装期间压到 0，收尾时拉起来 —— 这是这段动作的落点。
  emissiveMats = [];
  const seen = new Set();
  for (const p of parts) {
    for (const m of p.meshes) for (const mm of matList(m)) {
      if (seen.has(mm.uuid)) continue;
      if (!mm.emissive) continue;
      if (!p.meta.emissive && !mm.emissiveMap) continue;
      seen.add(mm.uuid);
      emissiveMats.push({ mat: mm, base: mm.emissiveIntensity ?? 1 });
    }
  }
}

function setEmissiveLevel(x) {
  for (const e of emissiveMats) e.mat.emissiveIntensity = e.base * x;
}

function disposeTree(o) {
  o.traverse((n) => {
    n.geometry?.dispose();
    const m = n.material;
    if (!m) return;
    for (const mm of Array.isArray(m) ? m : [m]) {
      for (const k of Object.keys(mm)) if (mm[k]?.isTexture) mm[k].dispose();
      mm.dispose();
    }
  });
}

function applyDebris() {
  for (const o of baseObjs) o.visible = state.showDebris;
  $('btnDebris').setAttribute('aria-pressed', String(state.showDebris));
}

// ---------- 爆炸 ----------
const _a = new THREE.Vector3(), _b = new THREE.Vector3();

// 到位缓动：末段减速并轻微过冲，比线性或纯 easeOut 更像机械咬合
function easeOutBack(x) {
  const c = ASSEMBLE_BACK, c3 = c + 1;
  return 1 + c3 * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2);
}

// 组装期间每个零件走自己的时间轴：按烘焙好的 assembleDelay 错峰启动。
// 这是 ASSEMBLE 与「爆炸倒放」的本质区别 —— 靴子先归位、头盔最后。
function partFactor(p) {
  if (!state.assembling) return state.explode;
  const d = p.assembleDelay ?? 0;
  const w = plan.frame?.assembleWindow ?? 0.30;
  const local = THREE.MathUtils.clamp((state.assembleT - d) / w, 0, 1);
  return 1 - easeOutBack(local);
}

// 非选中组: base + 组向量 × 爆炸进度
// 选中组:   base + lerp(组向量 × 爆炸进度, 钻取向量, 钻取进度)
//           —— d=0 时行为不变，d=1 时无论爆炸进度多少都到达钻取位姿
function applyTransforms() {
  const e = state.explode, d = state.drill, sel = state.selected;
  for (const p of parts) {
    const v = p.vecLocal?.[state.mode];
    if (!v) { p.obj.position.copy(p.basePos); continue; }
    if (sel && p.groupKey === sel && p.vecLocal.drill) {
      _a.copy(v).multiplyScalar(e).lerp(_b.copy(p.vecLocal.drill), d);
      p.obj.position.copy(p.basePos).add(_a);
    } else {
      p.obj.position.copy(p.basePos).addScaledVector(v, e);
    }
  }
}

// 幽灵态：透明相关的属性改动会触发着色器重编译，所以只在选择变化时设一次，
// 每帧只改 opacity（不需要 needsUpdate）。
function setGhostMode(on) {
  for (const p of parts) {
    const ghost = on && p.groupKey !== state.selected;
    for (const m of p.meshes) for (const mm of matList(m)) {
      const wantT = ghost;
      if (mm.transparent !== wantT) {
        mm.transparent = wantT;
        mm.depthWrite = !wantT;   // 嵌套壳层叠加透明会有排序问题，关掉深度写入
        // Three.js 自 r155 起对「双面 + 透明」材质做两遍渲染（先背面后正面）。
        // 实测幽灵化 132 个网格会额外产生 43.5 万面。幽灵透明度只有 0.06，
        // 两遍带来的排序改善看不出来，强制单遍。
        mm.forceSinglePass = wantT;
        mm.needsUpdate = true;
      }
      if (!ghost) mm.opacity = 1;
      mm.userData_ghost = ghost;
    }
  }
}

function updateGhostOpacity() {
  if (!state.selected && state.drill < 0.001) return;
  const outside = THREE.MathUtils.lerp(1, 0.06, state.drill);
  const sibling = THREE.MathUtils.lerp(1, 0.22, state.drill);
  for (const p of parts) {
    const inGroup = p.groupKey === state.selected;
    // 组内逐件浏览时，非聚焦的同组件半透，聚焦件保持实体
    const o = inGroup ? (state.focus < 0 || p.focusIndex === state.focus ? 1 : sibling)
                      : outside;
    for (const m of p.meshes) for (const mm of matList(m)) {
      if (mm.transparent) mm.opacity = o;
    }
  }
}

// 组内按钻取轴上的位置排序，逐件浏览时顺序才符合拆解层次
function indexGroupParts(key) {
  const list = partsByGroup.get(key) || [];
  const scored = list.map((p) => ({
    p, k: p.vecLocal?.drill ? p.vecLocal.drill.length() : 0,
  })).sort((a, b) => a.k - b.k);
  scored.forEach((x, i) => { x.p.focusIndex = i; });
  return scored.map((x) => x.p);
}

function setFocus(i) {
  const list = partsByGroup.get(state.selected) || [];
  if (!list.length) return;
  state.focus = i < 0 ? -1 : ((i % list.length) + list.length) % list.length;
  // 同组其余件需要参与透明混合，否则聚焦看不出来
  const on = state.focus >= 0;
  for (const p of list) for (const m of p.meshes) for (const mm of matList(m)) {
    const want = on && p.focusIndex !== state.focus;
    if (mm.transparent !== want) {
      mm.transparent = want; mm.depthWrite = !want;
      mm.forceSinglePass = want; mm.needsUpdate = true;
    }
    if (!want) mm.opacity = 1;
  }
  updateGhostOpacity();
  renderInspector();
}

// ---------- UI ----------
const viewsEl = $('views');
for (const [name, dir] of Object.entries(VIEWS)) {
  const b = document.createElement('button');
  b.textContent = name;
  b.onclick = () => setView(name);
  viewsEl.appendChild(b);
}
function setView(name) {
  state.viewDir.set(...VIEWS[name]).normalize();
  state.tweening = true;
  for (const b of viewsEl.children) b.setAttribute('aria-pressed', String(b.textContent === name));
}
setView('ISO');

// ---------- 拾取与选择 ----------
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
// 位移超过此像素数即判为拖拽旋转，不算点击。触摸比鼠标抖，阈值放宽。
const DRAG_SLOP_MOUSE = 5, DRAG_SLOP_TOUCH = 12;
let downAt = null, hovered = null, lastHoverAt = 0;

// 直接对 147 个 mesh、54 万面做三角形求交实测要 5.7ms/次，悬停时会掉帧。
// 改成两阶段：先用包围盒筛出候选并按入射距离排序，再按序做精确求交，
// 一旦已命中的距离小于下一候选的盒入射距离即可提前结束。
let boxesDirty = true;
const _box = new THREE.Box3(), _pt = new THREE.Vector3(), _m = new THREE.Matrix4();

function buildLocalBoxes() {
  for (const p of parts) {
    p.obj.updateWorldMatrix(true, false);
    const lb = new THREE.Box3();
    for (const mesh of p.meshes) {
      if (!mesh.geometry.boundingBox) mesh.geometry.computeBoundingBox();
      mesh.updateWorldMatrix(true, false);
      _m.copy(p.obj.matrixWorld).invert().multiply(mesh.matrixWorld);
      lb.union(mesh.geometry.boundingBox.clone().applyMatrix4(_m));
    }
    p.localBox = lb;
    p.worldBox = new THREE.Box3();
  }
  boxesDirty = true;
}

function refreshWorldBoxes() {
  for (const p of parts) {
    if (!p.localBox) continue;
    p.obj.updateWorldMatrix(true, false);
    p.worldBox.copy(p.localBox).applyMatrix4(p.obj.matrixWorld);
  }
  boxesDirty = false;
}

function pickAt(clientX, clientY) {
  if (!pickTargets.length) return null;
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((clientX - r.left) / r.width) * 2 - 1,
          -((clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  if (boxesDirty) refreshWorldBoxes();

  const cand = [];
  for (const p of parts) {
    if (!p.worldBox || p.worldBox.isEmpty()) continue;
    if (raycaster.ray.intersectBox(p.worldBox, _pt)) {
      cand.push([raycaster.ray.origin.distanceTo(_pt), p]);
    }
  }
  if (!cand.length) return null;
  cand.sort((a, b) => a[0] - b[0]);

  let best = Infinity, bestKey = null, tested = 0;
  for (const [boxDist, p] of cand) {
    if (boxDist > best) break;          // 后续候选的盒都比已命中更远
    tested++;
    const hits = raycaster.intersectObjects(p.meshes, false);
    if (hits.length && hits[0].distance < best) {
      best = hits[0].distance;
      bestKey = p.groupKey;
    }
  }
  pickAt.lastStats = { candidates: cand.length, tested, total: parts.length };
  return bestKey;
}

function selectGroup(key) {
  if (key && !groupIndex[key]) return;
  if (state.selected === key) return;
  state.selected = key;
  state.targetDrill = key ? 1 : 0;
  state.focus = -1;
  setGhostMode(!!key);
  if (key) indexGroupParts(key);
  computeDrillFraming();
  renderInspector();
  applyTransforms();
}

function computeDrillFraming() {
  const g = state.selected && groupIndex[state.selected];
  if (!g) { state.zoomFitDrill = state.zoomFit; state.targetDrillPos.set(0, 0, 0); return; }
  const lo = g.drillBounds.min, hi = g.drillBounds.max;
  state.zoomFitDrill = fitZoom(lo, hi);
  state.targetDrillPos
    .set((lo[0] + hi[0]) / 2, (lo[1] + hi[1]) / 2, (lo[2] + hi[2]) / 2)
    .sub(currentCenter).multiplyScalar(modelScale);
}

function renderInspector() {
  const el = $('inspect');
  const key = state.selected;
  if (!key) { el.style.display = 'none'; buildRoster(); return; }
  const g = groupIndex[key];
  const list = partsByGroup.get(key) || [];
  const focused = state.focus >= 0 ? list.find((p) => p.focusIndex === state.focus) : null;
  const sideText = { L: 'LEFT', R: 'RIGHT', C: 'CENTER' }[g.side] || g.side;
  $('insName').textContent = g.part.replace(/_/g, ' ').toUpperCase();
  $('insKicker').textContent = `SUBASSEMBLY · ${sideText}`;
  const rows = [
    ['PARTS', g.count],
    ['TRIANGLES', g.tris.toLocaleString()],
    ['HEIGHT', `${(g.hRange[0] * 100).toFixed(0)}–${(g.hRange[1] * 100).toFixed(0)}%`],
  ];
  if (g.emissive) rows.push(['EMISSIVE', `${g.emissive} ACTIVE`]);
  if (focused) {
    rows.length = 0;
    rows.push(['PART', `${state.focus + 1} / ${list.length}`],
              ['NAME', focused.meta.name.slice(0, 18)],
              ['TRIANGLES', focused.meta.tris.toLocaleString()],
              ['MATERIAL', String(focused.meta.material || '—').slice(0, 16)]);
    if (focused.meta.emissive) rows.push(['EMISSIVE', 'ACTIVE']);
  }
  $('insRows').innerHTML =
    rows.map(([k, v]) => `<div class="r"><span>${k}</span>` +
      `<span class="val${k === 'EMISSIVE' ? ' emis' : ''}">${v}</span></div>`).join('') +
    (focused
      ? '<div class="mats">← → 浏览组内零件 · ESC 退出</div>'
      : (g.materials.length
          ? `<div class="mats">MATERIALS<br>${g.materials.join(' · ')}</div>`
            + '<div class="mats">← → 逐件浏览</div>' : ''));
  el.style.display = 'block';
  $('roster').style.display = 'none';
}

renderer.domElement.addEventListener('pointerdown', (e) => {
  downAt = { x: e.clientX, y: e.clientY, touch: e.pointerType !== 'mouse' };
});
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!downAt) return;
  const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y);
  const slop = downAt.touch ? DRAG_SLOP_TOUCH : DRAG_SLOP_MOUSE;
  downAt = null;
  if (moved > slop) return;           // 是拖拽旋转，不是点击
  selectGroup(pickAt(e.clientX, e.clientY));
});
// 单次拾取实测约 3.8ms（两阶段筛选后），连续悬停会顶掉帧预算。
// 光标反馈并不需要高频，改成指针停下来之后再拾取一次。
let hoverTimer = 0;
renderer.domElement.addEventListener('pointermove', (e) => {
  clearTimeout(hoverTimer);
  if (hovered !== null) {
    hovered = null;
    renderer.domElement.classList.remove('pickable');
  }
  if (downAt) return;                    // 正在拖拽旋转，不做拾取
  const { clientX, clientY } = e;
  hoverTimer = setTimeout(() => {
    hovered = pickAt(clientX, clientY);
    renderer.domElement.classList.toggle('pickable', !!hovered);
  }, 120);
});
addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (state.focus >= 0) setFocus(-1); else selectGroup(null);
    return;
  }
  if (!state.selected) return;
  if (e.key === 'ArrowRight' || e.key === ']') { e.preventDefault(); setFocus(state.focus + 1); }
  if (e.key === 'ArrowLeft' || e.key === '[') { e.preventDefault(); setFocus(state.focus - 1); }
});
$('insClose').onclick = () => selectGroup(null);

function startAssemble() {
  if (!parts.length) return;
  selectGroup(null);
  state.assembling = true;
  state.assembleT = 0;
  state.explode = 1;            // 取景从全爆炸态起步
  state.targetExplode = 0;
  $('slider').value = 0;
  $('btnParts').setAttribute('aria-pressed', 'false');
  $('btnAssemble').setAttribute('aria-pressed', 'true');
  setEmissiveLevel(0);
  applyTransforms();
}

function stopAssemble(complete) {
  state.assembling = false;
  state.assembleT = 0;
  $('btnAssemble').setAttribute('aria-pressed', 'false');
  if (complete) { state.explode = 0; state.targetExplode = 0; }
  setEmissiveLevel(1);
  applyTransforms();
}

function buildRoster() {
  const el = $('rosterList');
  const panel = $('roster');
  if (MODEL_INDEX.length < 2) { panel.style.display = 'none'; return; }
  el.innerHTML = '';
  MODEL_INDEX.forEach((m, i) => {
    const row = document.createElement('div');
    row.className = 'item';
    row.setAttribute('aria-current', String(m.slug === slug));
    row.title = `${m.parts} 件 / ${m.groups} 组 / ${m.tris.toLocaleString()} 面`
              + `\n${m.author} · ${m.license}`;
    row.innerHTML =

      `<span><span class="nm">${m.name}</span><br>` +
      `<span class="sub">${m.subtitle} · ${m.parts} PARTS</span></span>`;
    if (m.slug !== slug) row.onclick = () => { location.search = `?model=${m.slug}`; };
    el.appendChild(row);
  });

}

function buildModeButtons() {
  const el = $('modes');
  el.innerHTML = '';
  for (const m of plan.modes.filter((x) => x !== 'drill')) {
    const b = document.createElement('button');
    b.textContent = m;
    b.setAttribute('aria-pressed', String(m === state.mode));
    b.onclick = () => {
      state.mode = m;
      for (const x of el.children) x.setAttribute('aria-pressed', String(x.textContent === m));
      computeFraming(currentBox, currentCenter);
      applyTransforms();
    };
    el.appendChild(b);
  }
}
let currentBox = null, currentCenter = null;

$('btnAssemble').onclick = () => {
  state.assembling ? stopAssemble(false) : startAssemble();
};
$('slider').oninput = (e) => {
  if (state.assembling) stopAssemble(false);
  state.targetExplode = Number(e.target.value);
  $('btnParts').setAttribute('aria-pressed', String(state.targetExplode > 0.001));
};
$('btnParts').onclick = () => {
  if (state.assembling) stopAssemble(false);
  state.targetExplode = state.targetExplode > 0.001 ? 0 : 1;
  $('slider').value = state.targetExplode;
  $('btnParts').setAttribute('aria-pressed', String(state.targetExplode > 0.001));
};
$('btnDebris').onclick = () => { state.showDebris = !state.showDebris; applyDebris(); };


addEventListener('resize', () => {
  aspect = innerWidth / innerHeight;
  camera.left = -FRUSTUM * aspect / 2; camera.right = FRUSTUM * aspect / 2;
  camera.top = FRUSTUM / 2; camera.bottom = -FRUSTUM / 2;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- 帧循环 ----------
function renderOnce() { renderer.render(scene, camera); }
window.__renderOnce = renderOnce;
window.__info = () => ({
  triangles: renderer.info.render.triangles,
  calls: renderer.info.render.calls,
  geometries: renderer.info.memory.geometries,
  textures: renderer.info.memory.textures,
});

const sph = new THREE.Spherical();
let frames = 0, fpsT = performance.now(), fps = 0;
const fpsHistory = [];

function tick() {
  requestAnimationFrame(tick);

  // 视角补间
  if (state.tweening) {
    const want = state.viewDir.clone().multiplyScalar(3);
    camera.position.lerp(want, 0.12);
    if (camera.position.distanceTo(want) < 0.002) { camera.position.copy(want); state.tweening = false; }
    camera.lookAt(controls.target);
  }

  // 组装时间轴
  const now0 = performance.now();
  const dt = Math.min((now0 - (tick.last || now0)) / 1000, 0.1);   // 卡顿时钳住步长
  tick.last = now0;

  let dirty = false;
  if (state.assembling) {
    state.assembleT += dt / ASSEMBLE_SECONDS;
    // 取景整体从全爆炸收到装配态；位置由 partFactor 各自的时间轴驱动
    state.explode = 1 - THREE.MathUtils.smoothstep(state.assembleT, 0, 1);
    // 收尾 18% 点亮
    setEmissiveLevel(THREE.MathUtils.smoothstep(state.assembleT, 0.82, 1.0));
    dirty = true;
    if (state.assembleT >= 1) stopAssemble(true);
  }

  // 爆炸与钻取补间
  if (!state.assembling) {
  if (Math.abs(state.explode - state.targetExplode) > 0.0004) {
    state.explode += (state.targetExplode - state.explode) * 0.1;
    dirty = true;
  }
  }
  if (Math.abs(state.drill - state.targetDrill) > 0.0004) {
    state.drill += (state.targetDrill - state.drill) * 0.12;
    dirty = true;
  }
  if (dirty) { applyTransforms(); updateGhostOpacity(); boxesDirty = true; }

  // 取景两层插值：先按爆炸进度，再按钻取进度收拢到选中组
  const baseZoom = THREE.MathUtils.lerp(state.zoomFit, state.zoomFitFull, state.explode);
  const wantZoom = THREE.MathUtils.lerp(baseZoom, state.zoomFitDrill, state.drill);
  camera.zoom += (wantZoom * state.userZoom - camera.zoom) * 0.12;
  camera.updateProjectionMatrix();
  _a.lerpVectors(state.targetAssembled, state.targetFull, state.explode);
  _a.lerp(state.targetDrillPos, state.drill);
  controls.target.lerp(_a, 0.15);

  controls.update();
  headlight.position.copy(camera.position);
  renderOnce();

  // 遥测
  frames++;
  const now = performance.now();
  if (now - fpsT >= 500) {
    fps = Math.round(frames * 1000 / (now - fpsT));
    frames = 0; fpsT = now;
    fpsHistory.push(fps);
    if (fpsHistory.length > 200) fpsHistory.shift();
    window.__fpsHistory = fpsHistory;
    $('fps').textContent = fps;
    $('tri').textContent = renderer.info.render.triangles.toLocaleString();
    $('dc').textContent = renderer.info.render.calls;
  }
  sph.setFromVector3(camera.position);
  $('az').textContent = (THREE.MathUtils.radToDeg(sph.theta)).toFixed(1) + '°';
  $('el').textContent = (90 - THREE.MathUtils.radToDeg(sph.phi)).toFixed(1) + '°';
  $('zm').textContent = camera.zoom.toFixed(2);
  $('ex').textContent = Math.round(state.explode * 100) + '%';
  $('mo').textContent = state.assembling
    ? `ASSEMBLE ${Math.round(state.assembleT * 100)}%` : 'IDLE';
}

});

// ---------------------------------------------------------------------------
// Agent 工具层
//
// 这个项目最初的命题是「Agent 能把 Web 当作表达介质做到什么程度」。
// 场景的每一种状态变化都已经是一个纯函数式的原语，把它们收成带 schema 的
// 命令集，LLM 就能用自然语言意图驱动这个场景，而不需要懂 Three.js。
//
// 页面自身不调用任何 LLM。它只暴露命令面与 schema；
// 由外部（agent、脚本、控制台）来决定调用序列。
// ---------------------------------------------------------------------------
const AGENT_TOOLS = {
  listModels: {
    描述: '列出可用的装甲模型及其部件与组数',
    参数: {},
    run: () => (MODEL_INDEX.length ? MODEL_INDEX : MODELS.map((s) => ({ slug: s }))),
  },
  loadModel: {
    描述: '切换到指定模型（会重新加载页面）',
    参数: { slug: '模型标识，取自 listModels' },
    run: ({ slug }) => { location.search = `?model=${encodeURIComponent(slug)}`; },
  },
  listGroups: {
    描述: '列出当前模型的所有子装配体及其部件数、三角面数、发光件数',
    参数: {},
    run: () => Object.entries(groupIndex).map(([key, g]) => ({
      key, part: g.part, side: g.side, parts: g.count, tris: g.tris,
      emissive: g.emissive, hRange: g.hRange,
    })),
  },
  setView: {
    描述: '切换正交视角',
    参数: { name: `六选一: ${Object.keys(VIEWS).join(' / ')}` },
    run: ({ name }) => { setView(name); return { view: name }; },
  },
  setExplode: {
    描述: '设置爆炸进度，0 为装配态，1 为完全展开',
    参数: { value: '0 到 1 的小数' },
    run: ({ value }) => {
      const v = THREE.MathUtils.clamp(Number(value), 0, 1);
      if (state.assembling) stopAssemble(false);
      state.targetExplode = v; $('slider').value = v;
      $('btnParts').setAttribute('aria-pressed', String(v > 0.001));
      return { explode: v };
    },
  },
  setExplodeMode: {
    描述: '切换爆炸算法',
    参数: { mode: `四选一: ${['radial','semantic','group','groupSpread'].join(' / ')}` },
    run: ({ mode }) => { window.__setMode(mode); return { mode }; },
  },
  focusGroup: {
    描述: '钻取某个子装配体：其余幽灵化、该组组内展开、相机对焦',
    参数: { key: '组标识，形如 chest/C，取自 listGroups；传 null 取消' },
    run: ({ key }) => { selectGroup(key ?? null); return { selected: state.selected }; },
  },
  focusPart: {
    描述: '在已钻取的组内聚焦某一个零件',
    参数: { index: '组内序号，从 0 开始；传 -1 取消聚焦' },
    run: ({ index }) => {
      if (!state.selected) throw new Error('先用 focusGroup 选中一个组');
      setFocus(Number(index));
      const list = partsByGroup.get(state.selected) || [];
      const f = list.find((p) => p.focusIndex === state.focus);
      return { index: state.focus, name: f?.meta.name ?? null, tris: f?.meta.tris ?? null };
    },
  },
  playAssemble: {
    描述: '播放组装动画：按穿戴顺序逐组归位，收尾点亮发光件',
    参数: {},
    run: () => { startAssemble(); return { duration: ASSEMBLE_SECONDS }; },
  },
  getState: {
    描述: '读取当前场景状态，用于决定下一步',
    参数: {},
    run: () => ({
      model: slug, source: window.__source?.mode ?? null,
      view: [...viewsEl.children].find((b) => b.getAttribute('aria-pressed') === 'true')?.textContent ?? null,
      mode: state.mode, explode: +state.explode.toFixed(3),
      selected: state.selected, focus: state.focus,
      assembling: state.assembling,
      azimuth: +THREE.MathUtils.radToDeg(sph.theta).toFixed(1),
      elevation: +(90 - THREE.MathUtils.radToDeg(sph.phi)).toFixed(1),
      groups: Object.keys(groupIndex).length,
    }),
  },
};

// 顺序执行一串命令；每步之间等待，让补间动画走完再进入下一步。
async function runScript(steps) {
  const log = [];
  for (const step of steps) {
    const { tool, args = {}, waitMs = 900 } = step;
    const t = AGENT_TOOLS[tool];
    if (!t) { log.push({ tool, error: '未知命令' }); continue; }
    try {
      log.push({ tool, args, result: t.run(args) ?? null });
    } catch (e) {
      log.push({ tool, args, error: String(e.message || e) });
    }
    if (waitMs) await new Promise((r) => setTimeout(r, waitMs));
  }
  return log;
}

window.armorLab = {
  tools: AGENT_TOOLS,
  call: (tool, args) => AGENT_TOOLS[tool].run(args || {}),
  run: runScript,
  // 给 LLM 用的工具定义，形状对齐常见的 function-calling schema
  schema: () => Object.entries(AGENT_TOOLS).map(([name, t]) => ({
    name, description: t.描述,
    parameters: {
      type: 'object',
      properties: Object.fromEntries(
        Object.entries(t.参数).map(([k, v]) => [k, { type: 'string', description: v }])),
      required: Object.keys(t.参数),
    },
  })),
};

// 生成清单缩略图时用：隐藏全部 HUD，只留纯净画布
window.__shotMode = (on = true) => {
  for (const el of document.querySelectorAll('.panel,.hd,.scrim,#load,#ctl')) {
    el.style.display = on ? 'none' : '';
  }
};

window.__assemble = startAssemble;
window.__stopAssemble = stopAssemble;
window.__setMode = (m) => {
  if (!plan.modes.includes(m)) throw new Error('unknown mode ' + m);
  state.mode = m;
  for (const x of $('modes').children) x.setAttribute('aria-pressed', String(x.textContent === m));
  computeFraming(currentBox, currentCenter);
  applyTransforms();
};
window.__state = state;
window.__select = selectGroup;
window.__focus = setFocus;
window.__groups = () => Object.keys(groupIndex);
// 结构指纹只能证明节点没被重排；这里进一步验证运行时按 node 索引取到的
// 对象，确实是 manifest 里记录的那个零件 —— 比对各自的世界包围盒中心。
// 对照用：把各零件绑定的 manifest 记录整体错位 shift 格，模拟 node 索引被打乱。
// 若 __verifyManifest 有效，错位后偏差必须显著变大 —— 否则该校验是空的。
window.__scrambleMeta = (shift = 1) => {
  const metas = parts.map((p) => p.meta);
  const n = metas.length;
  parts.forEach((p, i) => { p.meta = metas[(i + shift) % n]; });
  return n;
};

window.__verifyManifest = () => {
  if (boxesDirty) refreshWorldBoxes();
  const c = new THREE.Vector3();
  let worst = 0, worstName = null, n = 0;
  const devs = [];
  const median = (a) => { const b = [...a].sort((x, y) => x - y);
    return b.length ? b[Math.floor(b.length / 2)] : 0; };
  const H = plan.height;
  for (const p of parts) {
    if (!p.worldBox || p.worldBox.isEmpty()) continue;
    p.worldBox.getCenter(c);
    // manifest 的 center 在模型空间；换算到当前世界空间
    const exp = new THREE.Vector3(...p.meta.center)
      .sub(currentCenter).multiplyScalar(modelScale);
    // 期望位移必须用 plan 里的原始向量（gltf 场景空间），不能用 p.vecLocal ——
    // 后者已被 Matrix3 变换到各自父节点的局部空间，与 meta.center 不同空间。
    // 根节点只有缩放与平移、无旋转，所以场景空间方向乘 modelScale 即为世界空间。
    const entry = plan.parts[String(p.meta.node)];
    const raw = entry?.[state.mode];
    if (raw) {
      const off = new THREE.Vector3(...raw).multiplyScalar(H * state.explode);
      if (state.selected && p.groupKey === state.selected && entry.drill) {
        off.lerp(new THREE.Vector3(...entry.drill).multiplyScalar(H), state.drill);
      }
      exp.addScaledVector(off, modelScale);
    }
    const d = c.distanceTo(exp) / modelScale / H;   // 以身高为单位
    if (!Number.isFinite(d)) continue;
    devs.push(d);
    if (d > worst) { worst = d; worstName = p.meta.name; }
    n++;
  }
  return { parts: n, maxDeviationInHeights: +worst.toFixed(6),
           medianDeviation: +median(devs).toFixed(6), worstPart: worstName };
};

window.__debugScene = () => {
  let tris = 0, meshes = 0, hiddenTris = 0, dsTransparent = 0, dsTransTris = 0;
  scene.traverse((n) => {
    if (!n.isMesh || !n.geometry?.index) return;
    const t = n.geometry.index.count / 3;
    let vis = n.visible;
    n.traverseAncestors((a) => { if (!a.visible) vis = false; });
    if (!vis) { hiddenTris += t; return; }
    meshes++; tris += t;
    for (const mm of matList(n)) {
      if (mm.transparent && mm.side === THREE.DoubleSide && !mm.forceSinglePass) {
        dsTransparent++; dsTransTris += t; break;
      }
    }
  });
  return { visibleMeshes: meshes, visibleTris: tris, hiddenTris,
           doubleSidedTransparentMeshes: dsTransparent, theirTris: dsTransTris,
           predictedRenderTris: tris + dsTransTris, reported: renderer.info.render.triangles };
};
window.__pickStats = () => pickAt.lastStats;
window.__pickCost = (n = 200) => {
  const t0 = performance.now();
  for (let i = 0; i < n; i++) pickAt(innerWidth * 0.5, innerHeight * 0.45);
  return +((performance.now() - t0) / n).toFixed(3);
};
</script>
