<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="可交互的装甲档案：正交视角、逐件拆解、组装与发射。零件分类与爆炸规划全部由程序从几何推导，没有手工标注。">
<!-- 社交预览。__SITE_URL__ 由 scripts/build_site.mjs 在出站点时替换成绝对地址 ——
     og:image 必须是绝对 URL，而绝对地址属于部署信息，不该写死在源文件里。
     占位符不存在时构建会失败，避免这里被改动后静默失效。 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="ARMOR LAB">
<meta property="og:title" content="ARMOR LAB — 可交互装甲档案">
<meta property="og:description" content="正交视角、逐件拆解、组装与发射。零件分类与爆炸规划全部由程序从几何推导，没有手工标注。">
<meta property="og:url" content="__SITE_URL__/">
<meta property="og:image" content="__SITE_URL__/social-preview.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="正交视角下的钢铁侠装甲，左手正在发射掌心射流，四周是工程控制台式的遥测读数">
<meta name="twitter:card" content="summary_large_image">
<title>ARMOR LAB</title>
<style>
  :root{
    --bg:#0a0c0f; --fg:#c8d2dc; --dim:#5a6672; --accent:#e8541f; --line:#1b2128;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font:11px/1.5 var(--mono);letter-spacing:.06em;overflow:hidden}
  canvas{display:block;position:fixed;inset:0;touch-action:none}
  .panel{position:fixed;z-index:2}
  /* 幽灵态下模型会压到遥测文字上，加一层与背景同色的柔和衬底保证可读性 */
  .scrim{position:fixed;z-index:1;pointer-events:none}
  #scrimR{top:0;right:0;width:320px;height:340px;
    background:radial-gradient(120% 100% at 100% 0%,
      rgba(10,12,15,.94) 0%, rgba(10,12,15,.80) 45%, rgba(10,12,15,0) 100%)}
  #scrimL{top:0;left:0;width:340px;height:400px;
    background:radial-gradient(120% 100% at 0% 0%,
      rgba(10,12,15,.94) 0%, rgba(10,12,15,.80) 45%, rgba(10,12,15,0) 100%)}
  #scrimB{bottom:0;left:0;width:760px;height:190px;
    background:linear-gradient(0deg, rgba(10,12,15,.92) 0%, rgba(10,12,15,0) 100%)}
  /* 署名在右下角，那一带原本没有衬底；幽灵态下模型会压到文字上 */
  #scrimC{bottom:0;right:0;width:380px;height:180px;
    background:radial-gradient(120% 100% at 100% 100%,
      rgba(10,12,15,.94) 0%, rgba(10,12,15,.78) 45%, rgba(10,12,15,0) 100%)}
  .lbl{color:var(--dim);font-size:9px;letter-spacing:.18em}
  .val{font-size:13px;color:var(--fg)}
  .hd{position:fixed;top:16px;left:20px;z-index:2}
  .hd h1{margin:0;font-size:12px;font-weight:400;letter-spacing:.3em}
  .hd .sub{color:var(--dim);font-size:9px;letter-spacing:.18em;margin-top:4px}

  #tele{top:16px;right:20px;text-align:right;min-width:150px}
  #tele .row{display:flex;justify-content:space-between;gap:16px;padding:2px 0}
  #tele .row span:first-child{color:var(--dim);font-size:9px;letter-spacing:.14em}
  #tele .sect{margin-top:10px;padding-top:6px;border-top:1px solid var(--line)}

  #ctl{bottom:18px;left:20px;display:flex;flex-direction:column;gap:12px}
  .grp{display:flex;gap:4px;align-items:center}
  button{background:transparent;border:1px solid var(--line);color:var(--dim);
    font:inherit;letter-spacing:.12em;padding:5px 9px;cursor:pointer}
  button:hover{border-color:var(--dim);color:var(--fg)}
  button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
  button:disabled{opacity:.32;cursor:not-allowed}
  button:disabled:hover{border-color:var(--line);color:var(--dim)}
  input[type=range]{width:190px;accent-color:var(--accent)}
  /* 署名块在 DOM 里是 #ctl 的子节点，桌面端 fixed 出流、独占右下角；
     移动端（见媒体查询）改回 static，自然成为底部控制栈的最后一行。
     这样两套布局不需要任何 JS 参与。 */
  #credit{position:fixed;right:20px;bottom:18px;z-index:2;text-align:right;
    max-width:min(46vw,380px);color:var(--dim);font-size:9px;
    letter-spacing:.1em;line-height:1.8}
  #credit .lbl{margin-bottom:2px}
  #credit a{color:var(--fg);text-decoration:none;border-bottom:1px solid var(--line)}
  #credit a:hover{color:var(--accent);border-bottom-color:var(--accent)}
  #credit .sep{color:var(--line);padding:0 3px}
  /* 与 #credit 同一套策略：桌面端 fixed 叠在其上方，移动端退回流内 */
  #tour{position:fixed;right:20px;bottom:70px;z-index:2;text-align:right;display:none;
    max-width:min(46vw,380px);color:var(--dim);font-size:9px;letter-spacing:.1em;
    line-height:1.8}
  #tour #tourCmd{color:var(--accent);font-size:11px;word-break:break-all}
  #roster{left:20px;top:74px;display:none}
  #roster .item{display:flex;gap:9px;align-items:center;padding:5px 6px 5px 0;
    cursor:pointer;border-left:1px solid transparent}
  #roster .item:hover{border-left-color:var(--dim)}
  #roster .item[aria-current="true"]{border-left-color:var(--accent)}
  #roster .item img{width:34px;height:42px;object-fit:cover;background:#12161b;
    padding-left:0;margin-left:8px;filter:saturate(.85)}
  #roster .item[aria-current="true"] img{filter:none}
  #roster .no{color:var(--dim);font-size:9px;width:16px;text-align:right}
  #roster .nm{font-size:12px;letter-spacing:.14em}
  #roster .sub{color:var(--dim);font-size:9px;letter-spacing:.1em}
  #roster .item[aria-current="true"] .nm{color:var(--accent)}
  #inspect{left:20px;top:70px;display:none;min-width:210px;max-width:260px;
    border-left:1px solid var(--accent);padding:2px 0 2px 12px}
  #inspect .insName{font-size:15px;letter-spacing:.18em;margin:2px 0 8px;color:var(--fg)}
  #inspect .r{display:flex;justify-content:space-between;gap:14px;padding:1px 0}
  #inspect .r span:first-child{color:var(--dim);font-size:9px;letter-spacing:.14em}
  #inspect .mats{color:var(--dim);font-size:9px;margin-top:6px;line-height:1.6;
    word-break:break-all}
  #inspect .emis{color:var(--accent)}
  #insClose{margin-top:10px}
  canvas{cursor:default}
  canvas.pickable{cursor:pointer}
  #load{position:fixed;inset:0;z-index:9;background:var(--bg);display:grid;
    place-content:center;text-align:center;gap:8px;transition:opacity .4s}
  #load.done{opacity:0;pointer-events:none}
  #loadName{font-size:17px;letter-spacing:.26em}
  #loadStage{margin-top:4px}
  #bar{width:220px;height:1px;background:var(--line);margin:0 auto}
  #bar i{display:block;height:100%;width:0;background:var(--accent)}
  #err{color:var(--accent);max-width:60ch;text-align:left;white-space:pre-wrap}
  /* 媒体查询必须放在所有基础规则之后。
     此前它在文件开头，与 #tele / #roster / #ctl / #scrim* 同为 id 选择器、
     特异性相同，而媒体查询本身不增加特异性 —— 后写的基础规则一律胜出，
     整个移动端布局其实从未生效（只有 html,body 的字号例外，
     因为那条基础规则写在前面）。 */
  /* 移动端紧凑布局：390px 宽的屏幕放不下桌面版 HUD */
  @media (max-width:820px){
    html,body{font-size:10px}
    .hd h1{font-size:11px;letter-spacing:.24em}
    #tele{top:10px;right:12px;min-width:0}
    #tele .perf{display:none}          /* 性能读数在手机上不是重点 */
    /* 右上角遥测块在 390 宽下占到 x=260、底边 128。标题与清单都必须让开它：
       标题限宽并把副标题截断，清单整体挪到遥测块下方。
       这几个数字由 __verifyHud() 兜底 —— 它在任何视口下检查 HUD 面板两两不重叠。 */
    .hd{max-width:58vw}
    .hd .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #roster{left:12px;top:136px}
    #roster #rosterList{display:flex;gap:6px}
    #roster .item img{width:26px;height:32px;margin-left:4px}
    #roster .nm{font-size:10px}
    #roster .sub,#roster .no{display:none}
    #inspect{left:12px;top:120px;max-width:min(58vw,220px);padding-left:9px}
    #inspect .insName{font-size:13px}
    #ctl{left:12px;right:12px;bottom:12px;gap:8px}
    #views,#ctl .grp{flex-wrap:wrap}
    button{padding:7px 9px}            /* 触摸目标不小于约 30px */
    input[type=range]{width:min(46vw,190px)}
    /* 顶部通栏：手机上标题、遥测、清单横向排开，角落的径向衬底盖不住 */
    #scrimL{width:100vw;height:46vh;
      background:linear-gradient(180deg, rgba(10,12,15,.95) 0%,
        rgba(10,12,15,.74) 48%, rgba(10,12,15,0) 100%)}
    #scrimR{display:none}
    #scrimB{width:100vw;height:32vh}   /* 底部多了一行署名，衬底跟着长高 */
    #scrimC{display:none}              /* 已被通栏的 scrimB 覆盖 */
    #credit{position:static;text-align:left;max-width:none;line-height:1.7}
    #tour{position:static;text-align:left;max-width:none}
  }
</style>
</head>
<body>
<div class="panel" id="roster">
  <div class="lbl">ARMOR ARCHIVE</div>
  <div id="rosterList"></div>
</div>

<div class="scrim" id="scrimL"></div>
<div class="scrim" id="scrimR"></div>
<div class="scrim" id="scrimB"></div>
<div class="scrim" id="scrimC"></div>

<div class="hd">
  <h1>ARMOR LAB</h1>
  <div class="sub" id="modelName">—</div>
</div>

<div class="panel" id="tele">
  <div class="row"><span>AZIMUTH</span><span class="val" id="az">0.0°</span></div>
  <div class="row"><span>ELEVATION</span><span class="val" id="el">0.0°</span></div>
  <div class="row"><span>ORTHO ZOOM</span><span class="val" id="zm">1.00</span></div>
  <div class="row"><span>EXPLODE</span><span class="val" id="ex">0%</span></div>
  <div class="row"><span>MOTION</span><span class="val" id="mo">IDLE</span></div>
  <div class="sect perf">
    <div class="row"><span>FPS</span><span class="val" id="fps">—</span></div>
    <div class="row"><span>TRIANGLES</span><span class="val" id="tri">—</span></div>
    <div class="row"><span>DRAW CALLS</span><span class="val" id="dc">—</span></div>
    <div class="row"><span>SOURCE</span><span class="val" id="sc">—</span></div>
    <div class="row"><span>GROUPS</span><span class="val" id="gc">—</span></div>
    <div class="row"><span>PARTS</span><span class="val" id="pc">—</span></div>
    <div class="row"><span>LOAD</span><span class="val" id="lt">—</span></div>
  </div>
</div>

<div class="panel" id="ctl">
  <div class="grp" id="views"></div>
  <div class="grp"><span class="lbl">MODE</span><span id="modes" style="display:inline-flex;gap:4px"></span></div>
  <div class="grp">
    <span class="lbl">EXPLODE</span>
    <input type="range" id="slider" min="0" max="1" step="0.001" value="0">
    <button id="btnParts" aria-pressed="false">PARTS</button>
    <button id="btnAssemble">ASSEMBLE</button>
    <button id="btnDebris" aria-pressed="false">DEBRIS</button>
    <button id="btnRepulsor" aria-pressed="false">REPULSOR</button>
    <button id="btnLink" aria-pressed="false" title="复制当前视图的链接">LINK</button>
    <button id="btnTour" aria-pressed="false" title="让 Agent 命令集自己驱动一遍场景">TOUR</button>

  </div>

  <!-- CC-BY 3(a)(1) 要求的署名：作者、许可（含链接）、原始链接，
       以及 (B) 的「已改动」声明。桌面端定位到右下角，移动端 position:static
       退回流内，成为底部控制栈的最后一行 —— 两种布局下都必须可见，
       它此前只存在于清单项的 title 属性里，触屏设备根本触发不到。 -->
  <!-- Agent 导览的当前指令。项目的命题就是 Agent 层，但访客得开 devtools
       才看得到它存在 —— 这块把正在执行的命令显示出来，让命题本身可见。 -->
  <div id="tour">
    <div class="lbl"><span id="tourKicker">AGENT</span></div>
    <div id="tourCmd">—</div>
  </div>

  <div id="credit">
    <div class="lbl">MODEL CREDIT</div>
    <div id="crLine1">—</div>
    <div id="crLine2">—</div>
  </div>
</div>

<div class="panel" id="inspect">
  <div class="lbl" id="insKicker">SUBASSEMBLY</div>
  <div class="insName" id="insName">—</div>
  <div id="insRows"></div>
  <button id="insClose">CLOSE  ESC</button>
</div>

<div id="load">
  <div class="lbl" id="loadKicker">ARMOR ARCHIVE</div>
  <div class="val" id="loadName">—</div>
  <div id="bar"><i></i></div>
  <div class="lbl" id="loadStage">INITIALIZING</div>
  <div class="val" id="pct">00%</div>
  <div id="err"></div>
</div>

<script type="importmap">
{"imports":{
  "three":"./node_modules/three/build/three.module.js",
  "three/addons/":"./node_modules/three/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

// 模型清单由 scripts/build_index.py 生成，不写死在前端
let MODELS = ['hulkbuster', 'ironman'];   // index.json 加载前的兜底
let MODEL_INDEX = [];
async function loadIndex() {
  try {
    const r = await fetch('./assets/manifests/index.json');
    if (!r.ok) return;
    MODEL_INDEX = (await r.json()).models || [];
    if (MODEL_INDEX.length) MODELS = MODEL_INDEX.map((m) => m.slug);
  } catch { /* 用兜底清单 */ }
}
const params = new URLSearchParams(location.search);
const slug = params.get('model') || MODELS[0];
const srcPref = params.get('src') || 'auto';   // auto | raw | meshopt | draco

// 优先用压缩产物：读 dist/index.json（由 compress_models.mjs 生成）挑体积最小的。
// 哪种编码更小取决于模型 —— hulkbuster 上 draco 明显更好，ironman 上 meshopt 更好，
// 所以不能写死顺序。缺失则回退到未压缩的 scene.gltf。
async function resolveSource(name) {
  const raw = { url: `./assets/raw/${name}/scene.gltf`, mode: 'raw', bytes: 0 };
  if (srcPref === 'raw') return raw;
  let index = null;
  try {
    const r = await fetch(`./assets/dist/${name}/index.json`);
    if (r.ok) index = await r.json();
  } catch { /* 无压缩产物，回退 */ }
  if (!index || !Object.keys(index).length) return raw;

  const pick = srcPref === 'auto'
    ? Object.entries(index).sort((a, b) => a[1] - b[1])[0]
    : (index[srcPref] !== undefined ? [srcPref, index[srcPref]] : null);
  if (!pick) return raw;
  return { url: `./assets/dist/${name}/model.${pick[0]}.glb`, mode: pick[0], bytes: pick[1] };
}
const $ = (id) => document.getElementById(id);

// ---------- 视角预设：单位球方向 ----------
const VIEWS = {
  ISO:   [ 1,  0.75,  1],
  '3/4F':[ 0.6, 0.35, 1],
  FRONT: [ 0,  0,     1],
  SIDE:  [ 1,  0,     0],
  PLAN:  [ 0,  1,     0.001],
  REAR:  [ 0,  0.2,  -1],
};

function showFatal(msg, detail) {
  const el = $('err');
  if (el) el.textContent = msg + (detail ? '\n\n' + detail : '');
  const pct = $('pct');
  if (pct) pct.textContent = '—';
  $('load')?.classList.remove('done');
}

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  showFatal('这个浏览器无法创建 WebGL 上下文，页面需要 WebGL2。\n'
    + '可尝试：更新浏览器、在设置里启用硬件加速、或换一台设备。', String(e));
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.5;
document.body.appendChild(renderer.domElement);
// 显卡驱动重置或标签页长时间后台会丢上下文，静默变黑最难排查
renderer.domElement.addEventListener('webglcontextlost', (e) => {
  e.preventDefault();
  showFatal('WebGL 上下文丢失（通常是显卡驱动重置或标签页长时间后台）。\n刷新页面即可恢复。');
});

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0c0f);

// 正交相机：追求工程图观感，无透视畸变
const FRUSTUM = 1.5;
// 系统里开了「减少动态效果」时，动画应当直接给结果而不是过程。
// 用 matchMedia 实时跟随而不是载入时读一次 —— 用户可能中途改系统设置。
const reduceMotionMQ = matchMedia('(prefers-reduced-motion: reduce)');
const reduceMotion = () => reduceMotionMQ.matches;
const FIT_MARGIN = 1.06;          // 取景留边（对角线取景已偏保守）
const ASSEMBLE_SECONDS = 4.2;     // 整条组装时间轴的时长
const ASSEMBLE_BACK = 1.08;       // 到位时的轻微过冲，读作机械咬合；过大会穿模

// ---------- REPULSOR ----------
// 发射口不能写死在 hand 上：三个模型的臂链长度并不一样（hulkbuster 到 hand，
// ironman 右臂只分离到 upper_arm，samurai 只有左手）。改为取「臂链上最远的那一节」，
// 并要求它至少到小臂 —— 从上臂根部开火看起来是错的，宁可这一侧不开火。
const REPULSOR_SECONDS = 2.4;
const ARM_CHAIN = ['shoulder', 'upper_arm', 'forearm', 'hand'];   // 近端 -> 远端
const RECOIL_ATTEN = { hand: 1, forearm: 0.55, upper_arm: 0.28, shoulder: 0.1 };
const RECOIL_DIST = 0.05;         // 后坐峰值位移，单位为身高
const BEAM_LEN = 0.55;            // 射流长度，单位为身高
const BEAM_RADIUS = 0.022;        // 掌心处的半径；向远端扩口
let aspect = innerWidth / innerHeight;
const camera = new THREE.OrthographicCamera(
  -FRUSTUM * aspect / 2, FRUSTUM * aspect / 2, FRUSTUM / 2, -FRUSTUM / 2, -50, 50);
camera.position.set(1, 0.75, 1).normalize().multiplyScalar(3);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 0, 0);
controls.addEventListener('change', () => scheduleUrlSync());
controls.enableZoom = false;   // 缩放自管：否则 controls 的 change 事件会把
                               // 我们自己的取景动画误判成用户输入，形成反馈环
renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  state.userZoom = THREE.MathUtils.clamp(
    state.userZoom * Math.pow(0.999, e.deltaY), 0.25, 8);
}, { passive: false });

// 技术制图式打光：主光 + 侧补光 + 顶部轮廓光，不用环境贴图
scene.add(new THREE.HemisphereLight(0x8fa8c0, 0x14181d, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(3, 5, 4); scene.add(key);
const fill = new THREE.DirectionalLight(0x88a4c8, 0.9); fill.position.set(-4, 1, -3); scene.add(fill);
const rim = new THREE.DirectionalLight(0xffd9c0, 0.7); rim.position.set(0, 4, -5); scene.add(rim);
// 跟随相机的补光：装甲是开放壳体，爆炸后会大量露出背光的内表面
const headlight = new THREE.DirectionalLight(0xdfe8f2, 1.4);
scene.add(headlight);

// ---------- 状态 ----------
const state = {
  explode: 0, targetExplode: 0, showDebris: false, userZoom: 1,
  mode: 'groupSpread',
  selected: null, drill: 0, targetDrill: 0, focus: -1,
  assembling: false, assembleT: 0,
  repulsing: false, repulsorT: 0, repulsorRecoil: 0, repulsorSides: [],
  touring: false,
  zoomFitDrill: 1, targetDrillPos: new THREE.Vector3(),
  zoomFit: 1, zoomFitFull: 1,
  targetAssembled: new THREE.Vector3(), targetFull: new THREE.Vector3(),
  viewDir: new THREE.Vector3(1, 0.75, 1).normalize(),
  tweening: false,
};
let parts = [];          // {obj, basePos, dirLocal, meta}
let baseObjs = [];       // 地面碎石
let root = null;
let plan = null;         // <slug>.explode.json
let groupIndex = {};     // "部位/左右" -> 组元数据
let partsByGroup = new Map();
let pickTargets = [];    // 可拾取的 Mesh
let emissiveMats = [];   // {mat, base} —— 组装收尾时点亮
let modelScale = 1;
let loadStart = performance.now();

// ---------- 加载 ----------
async function loadModel(name) {
  $('load').classList.remove('done');
  $('err').textContent = '';
  loadStart = performance.now();

  const disp = (MODEL_INDEX.find((m) => m.slug === name) || {});
  $('loadName').textContent = disp.name || name.toUpperCase();
  $('loadKicker').textContent = disp.subtitle ? `ARMOR ARCHIVE · ${disp.subtitle}` : 'ARMOR ARCHIVE';
  $('loadStage').textContent = 'READING DRAWING INDEX';
  const [manifest, explodePlan] = await Promise.all([
    fetch(`./assets/manifests/${name}.json`).then(r => {
      if (!r.ok) throw new Error(`manifest ${r.status}`); return r.json();
    }),
    fetch(`./assets/manifests/${name}.explode.json`).then(r => {
      if (!r.ok) throw new Error(`explode plan ${r.status}`); return r.json();
    }),
  ]);
  plan = explodePlan;
  state.mode = plan.defaultMode || 'groupSpread';

  $('loadStage').textContent = 'RESOLVING GEOMETRY SOURCE';
  const source = await resolveSource(name);
  $('loadStage').textContent = `STREAMING ${source.mode.toUpperCase()}`
    + (source.bytes ? ` · ${(source.bytes / 1048576).toFixed(2)} MB` : '');
  const loader = new GLTFLoader();
  const dracoLoader = new DRACOLoader();
  dracoLoader.setDecoderPath('./node_modules/three/examples/jsm/libs/draco/');
  loader.setDRACOLoader(dracoLoader);
  loader.setMeshoptDecoder(MeshoptDecoder);

  const gltf = await loader.loadAsync(source.url, (e) => {
    if (e.lengthComputable) {
      const p = e.loaded / e.total;
      $('pct').textContent = String(Math.round(p * 100)).padStart(2, '0') + '%';
      $('bar').firstElementChild.style.width = (p * 100) + '%';
    }
  });

  if (root) { scene.remove(root); disposeTree(root); }
  root = new THREE.Group();
  root.add(gltf.scene);
  scene.add(root);

  // 按 node 索引取对象 —— manifest 用索引做键，因为节点名有重复
  parts = []; baseObjs = [];
  for (const meta of manifest.parts) {
    const obj = await gltf.parser.getDependency('node', meta.node);
    if (!obj) continue;
    if (meta.flag === 'base') { baseObjs.push(obj); obj.visible = false; continue; }
    parts.push({ obj, meta, basePos: obj.position.clone(), dirLocal: new THREE.Vector3() });
  }

  // 归一化：以可用部件（不含碎石）的包围盒把模型缩放到高度 1、居中到原点
  root.updateMatrixWorld(true);
  const box = new THREE.Box3();
  for (const p of parts) box.expandByObject(p.obj);
  const size = new THREE.Vector3(); box.getSize(size);
  const center = new THREE.Vector3(); box.getCenter(center);
  modelScale = 1 / Math.max(size.y, 1e-6);
  root.scale.setScalar(modelScale);
  root.position.copy(center).multiplyScalar(-modelScale);
  root.updateMatrixWorld(true);

  $('loadStage').textContent = 'INDEXING SUBASSEMBLIES';
  buildVectors(gltf.scene);
  buildGroups();
  buildLocalBoxes();
  state.selected = null; state.drill = 0; state.targetDrill = 0;
  renderInspector();
  currentBox = box.clone(); currentCenter = center.clone();
  computeFraming(currentBox, currentCenter);
  buildRepulsor();
  buildModeButtons();
  buildRoster();
  renderCredit(name);
  window.__urlRestored = restoreFromUrl();   // 供往返测试断言链接确实被用上了

  const srcLabel = source.mode.toUpperCase() +
    (source.bytes ? ` ${(source.bytes / 1048576).toFixed(2)}MB` : '');
  $('modelName').textContent =
    `${name.toUpperCase()} · ${parts.length} PARTS · ${srcLabel}`;
  $('sc').textContent = srcLabel;
  document.title = `ARMOR LAB — ${name.toUpperCase()}`;
  window.__source = source;
  $('pc').textContent = parts.length;
  $('gc').textContent = Object.keys(plan.groups || {}).length;
  $('lt').textContent = Math.round(performance.now() - loadStart) + 'ms';
  $('tri').textContent = renderer.info.render.triangles.toLocaleString();
  applyDebris();
  $('loadStage').textContent = 'SYSTEM ONLINE';
  $('load').classList.add('done');

  window.__ready = true;
  window.__stats = {
    model: name, parts: parts.length, base: baseObjs.length,
    loadMs: Math.round(performance.now() - loadStart),
    geometries: renderer.info.memory.geometries,
    textures: renderer.info.memory.textures,
  };
}

// 位移向量以「模型高度的分数」为单位，且自带幅度，所以不能用会归一化的
// transformDirection。取矩阵的 3x3 线性部分，旋转与缩放一并正确带上。
function buildVectors(gltfScene) {
  const H = plan.height;
  const M = new THREE.Matrix4();
  const m3 = new THREE.Matrix3();
  for (const p of parts) {
    const entry = plan.parts[String(p.meta.node)];
    p.vecLocal = {};
    if (!entry) continue;
    p.assembleDelay = entry.assembleDelay ?? 0;
    M.copy(p.obj.parent.matrixWorld).invert().multiply(gltfScene.matrixWorld);
    m3.setFromMatrix4(M);
    p.toLocal = m3.clone();   // 场景空间方向 -> 该零件父节点局部空间；后坐位移要用
    for (const mode of plan.modes) {
      const v = entry[mode];
      if (!v) continue;
      p.vecLocal[mode] = new THREE.Vector3(v[0], v[1], v[2])
        .multiplyScalar(H).applyMatrix3(m3);
    }
  }
}

// 取景：分别算「装配态」与「完全爆炸态」需要的正交缩放和视点，帧循环里按进度插值
// 用包围盒对角线（即外接球直径）取景。取 max(w,d) 会低估斜视角下的投影宽度 ——
// 3/4 视角时对角方向的实际跨度可达 1.4 倍，导致零件被裁到画面外。
// 对角线是方向无关的上界，用户任意旋转都不会裁切。
function fitZoom(lo, hi) {
  const w = (hi[0] - lo[0]) * modelScale;
  const h = (hi[1] - lo[1]) * modelScale;
  const d = (hi[2] - lo[2]) * modelScale;
  const diag = Math.hypot(w, h, d);
  const need = Math.max(diag, diag / aspect) * FIT_MARGIN;
  return FRUSTUM / Math.max(need, 1e-6);
}

function computeFraming(assembledBox, assembledCenter) {
  const fit = fitZoom;
  const aLo = assembledBox.min.toArray(), aHi = assembledBox.max.toArray();
  state.zoomFit = fit(aLo, aHi);

  const fb = plan.boundsAtFull?.[state.mode];
  if (fb) {
    state.zoomFitFull = fit(fb.min, fb.max);
    // 爆炸后包围盒中心相对装配态中心的偏移，换算到世界空间
    const fc = new THREE.Vector3(
      (fb.min[0] + fb.max[0]) / 2, (fb.min[1] + fb.max[1]) / 2, (fb.min[2] + fb.max[2]) / 2);
    state.targetFull.copy(fc).sub(assembledCenter).multiplyScalar(modelScale);
  } else {
    state.zoomFitFull = state.zoomFit;
    state.targetFull.set(0, 0, 0);
  }
  state.targetAssembled.set(0, 0, 0);
}

const EMISSIVE_COLOR = new THREE.Color(0x7fd4ff);

function matList(mesh) {
  return Array.isArray(mesh.material) ? mesh.material : [mesh.material];
}

// 材质在多个节点间共享（hulkbuster 是 19 个材质配 155 个节点），
// 直接改会牵连其它零件，所以每个 mesh 克隆一份自己的。
// 贴图在克隆时按引用共享，不额外占显存。
function buildGroups() {
  groupIndex = plan.groups || {};
  partsByGroup = new Map();
  pickTargets = [];
  for (const p of parts) {
    const key = `${p.meta.part}/${p.meta.side}`;
    p.groupKey = key;
    if (!partsByGroup.has(key)) partsByGroup.set(key, []);
    partsByGroup.get(key).push(p);

    p.meshes = [];
    p.obj.traverse((n) => {
      if (!n.isMesh) return;
      n.material = Array.isArray(n.material)
        ? n.material.map((m) => m.clone()) : n.material.clone();
      n.userData.part = p;
      p.meshes.push(n);
      pickTargets.push(n);
    });

    if (p.meta.emissive) {
      for (const m of p.meshes) for (const mm of matList(m)) {
        if (!mm.emissive) continue;
        mm.emissive.copy(EMISSIVE_COLOR);
        mm.emissiveIntensity = 2.4;
      }
    }
  }

  // 发光材质：manifest 标记的（hulkbuster 的 light 系材质），
  // 以及自带 emissive 贴图的（ironman 的方舟反应堆）。
  // 组装期间压到 0，收尾时拉起来 —— 这是这段动作的落点。
  emissiveMats = [];
  const seen = new Set();
  for (const p of parts) {
    for (const m of p.meshes) for (const mm of matList(m)) {
      if (seen.has(mm.uuid)) continue;
      if (!mm.emissive) continue;
      if (!p.meta.emissive && !mm.emissiveMap) continue;
      seen.add(mm.uuid);
      emissiveMats.push({ mat: mm, base: mm.emissiveIntensity ?? 1 });
    }
  }
}

function setEmissiveLevel(x) {
  for (const e of emissiveMats) e.mat.emissiveIntensity = e.base * x;
}

function disposeTree(o) {
  o.traverse((n) => {
    n.geometry?.dispose();
    const m = n.material;
    if (!m) return;
    for (const mm of Array.isArray(m) ? m : [m]) {
      for (const k of Object.keys(mm)) if (mm[k]?.isTexture) mm[k].dispose();
      mm.dispose();
    }
  });
}

function applyDebris() {
  for (const o of baseObjs) o.visible = state.showDebris;
  $('btnDebris').setAttribute('aria-pressed', String(state.showDebris));
}

// ---------- 爆炸 ----------
const _a = new THREE.Vector3(), _b = new THREE.Vector3();

// 到位缓动：末段减速并轻微过冲，比线性或纯 easeOut 更像机械咬合
function easeOutBack(x) {
  const c = ASSEMBLE_BACK, c3 = c + 1;
  return 1 + c3 * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2);
}

// 组装期间每个零件走自己的时间轴：按烘焙好的 assembleDelay 错峰启动。
// 这是 ASSEMBLE 与「爆炸倒放」的本质区别 —— 靴子先归位、头盔最后。
function partFactor(p) {
  if (!state.assembling) return state.explode;
  const d = p.assembleDelay ?? 0;
  const w = plan.frame?.assembleWindow ?? 0.30;
  const local = THREE.MathUtils.clamp((state.assembleT - d) / w, 0, 1);
  return 1 - easeOutBack(local);
}

// 非选中组: base + 组向量 × 爆炸进度
// 选中组:   base + lerp(组向量 × 爆炸进度, 钻取向量, 钻取进度)
//           —— d=0 时行为不变，d=1 时无论爆炸进度多少都到达钻取位姿
function applyTransforms() {
  const e = state.explode, d = state.drill, sel = state.selected;
  const rr = state.repulsorRecoil;
  for (const p of parts) {
    const v = p.vecLocal?.[state.mode];
    if (!v) {
      p.obj.position.copy(p.basePos);
    } else if (sel && p.groupKey === sel && p.vecLocal.drill) {
      _a.copy(v).multiplyScalar(e).lerp(_b.copy(p.vecLocal.drill), d);
      p.obj.position.copy(p.basePos).add(_a);
    } else {
      p.obj.position.copy(p.basePos).addScaledVector(v, e);
    }
    // 后坐与爆炸/钻取正交，直接叠加在最终位置上
    if (rr > 0 && p.recoilLocal) p.obj.position.addScaledVector(p.recoilLocal, rr);
  }
}

// 幽灵态：透明相关的属性改动会触发着色器重编译，所以只在选择变化时设一次，
// 每帧只改 opacity（不需要 needsUpdate）。
function setGhostMode(on) {
  for (const p of parts) {
    const ghost = on && p.groupKey !== state.selected;
    for (const m of p.meshes) for (const mm of matList(m)) {
      const wantT = ghost;
      if (mm.transparent !== wantT) {
        mm.transparent = wantT;
        mm.depthWrite = !wantT;   // 嵌套壳层叠加透明会有排序问题，关掉深度写入
        // Three.js 自 r155 起对「双面 + 透明」材质做两遍渲染（先背面后正面）。
        // 实测幽灵化 132 个网格会额外产生 43.5 万面。幽灵透明度只有 0.06，
        // 两遍带来的排序改善看不出来，强制单遍。
        mm.forceSinglePass = wantT;
        mm.needsUpdate = true;
      }
      if (!ghost) mm.opacity = 1;
      mm.userData_ghost = ghost;
    }
  }
}

function updateGhostOpacity() {
  if (!state.selected && state.drill < 0.001) return;
  const outside = THREE.MathUtils.lerp(1, 0.06, state.drill);
  const sibling = THREE.MathUtils.lerp(1, 0.22, state.drill);
  for (const p of parts) {
    const inGroup = p.groupKey === state.selected;
    // 组内逐件浏览时，非聚焦的同组件半透，聚焦件保持实体
    const o = inGroup ? (state.focus < 0 || p.focusIndex === state.focus ? 1 : sibling)
                      : outside;
    for (const m of p.meshes) for (const mm of matList(m)) {
      if (mm.transparent) mm.opacity = o;
    }
  }
}

// 组内按钻取轴上的位置排序，逐件浏览时顺序才符合拆解层次
function indexGroupParts(key) {
  const list = partsByGroup.get(key) || [];
  const scored = list.map((p) => ({
    p, k: p.vecLocal?.drill ? p.vecLocal.drill.length() : 0,
  })).sort((a, b) => a.k - b.k);
  scored.forEach((x, i) => { x.p.focusIndex = i; });
  return scored.map((x) => x.p);
}

function setFocus(i) {
  const list = partsByGroup.get(state.selected) || [];
  if (!list.length) return;
  state.focus = i < 0 ? -1 : ((i % list.length) + list.length) % list.length;
  // 同组其余件需要参与透明混合，否则聚焦看不出来
  const on = state.focus >= 0;
  for (const p of list) for (const m of p.meshes) for (const mm of matList(m)) {
    const want = on && p.focusIndex !== state.focus;
    if (mm.transparent !== want) {
      mm.transparent = want; mm.depthWrite = !want;
      mm.forceSinglePass = want; mm.needsUpdate = true;
    }
    if (!want) mm.opacity = 1;
  }
  updateGhostOpacity();
  renderInspector();
  scheduleUrlSync();
}

// ---------- UI ----------
const viewsEl = $('views');
for (const [name, dir] of Object.entries(VIEWS)) {
  const b = document.createElement('button');
  b.textContent = name;
  b.onclick = () => setView(name);
  viewsEl.appendChild(b);
}
// 这两个必须声明在 setView 之前：setView('ISO') 在模块初始化时就会执行一次，
// 而它会调 scheduleUrlSync —— 声明放在后面会撞进暂时性死区。
let urlTimer = 0;
let urlReady = false;          // 还原完成前不要回写，否则会把默认值覆盖掉链接里的值

function setView(name) {
  state.viewDir.set(...VIEWS[name]).normalize();
  state.tweening = true;
  for (const b of viewsEl.children) b.setAttribute('aria-pressed', String(b.textContent === name));
  scheduleUrlSync();
}
setView('ISO');

// ---------------------------------------------------------------------------
// 可分享的链接
//
// 原本只有 ?model 进 URL —— 调出来的状态没法指给别人看，而这个项目的命题
// 恰恰是「把 Web 当表达介质」。这里把「你看到的是什么」整个编码进查询串。
//
// 用 replaceState 不用 pushState：拖动相机会产生几百个中间状态，
// 塞进历史记录会把后退键变成噪音。
// 节流而不是防抖。相机的缩放与对焦点是逐帧渐近插值的，OrbitControls 因此
// 几乎每帧都发 change —— 纯防抖会被无限顺延，URL 在场景动着的时候永远不写。
// 改成「首次调用就排一次，窗口内的后续调用忽略」，连续拖动时 URL 也会跟着更新。
function scheduleUrlSync() {
  if (!urlReady || urlTimer) return;
  urlTimer = setTimeout(() => { urlTimer = 0; syncUrl(); }, 400);
}
function currentStateParams() {
  const sp = new URLSearchParams();
  sp.set('model', slug);
  if (srcPref !== 'auto') sp.set('src', srcPref);
  const sc = new THREE.Spherical().setFromVector3(camera.position);
  // 极小的负值经 toFixed 会写成 "-0.0"，分享出去的链接里看着像是坏的，压平掉
  const flat = (v) => (Math.abs(v) < 0.05 ? 0 : v).toFixed(1);
  sp.set('az', flat(THREE.MathUtils.radToDeg(sc.theta)));
  sp.set('el', flat(90 - THREE.MathUtils.radToDeg(sc.phi)));
  if (Math.abs(state.userZoom - 1) > 0.005) sp.set('z', state.userZoom.toFixed(3));
  if (state.targetExplode > 0.001) sp.set('ex', state.targetExplode.toFixed(3));
  if (plan && state.mode !== plan.defaultMode) sp.set('mode', state.mode);
  if (state.selected) sp.set('g', state.selected);
  if (state.focus >= 0) sp.set('p', String(state.focus));
  if (state.showDebris) sp.set('debris', '1');
  return sp;
}
function syncUrl() {
  if (!plan) return;
  history.replaceState(null, '', `?${currentStateParams()}`);
}

// 还原。每一项都要先验证再用 —— 链接是外部输入，坏值必须退回默认而不是让场景崩掉。
function restoreFromUrl() {
  const applied = [];
  const m = params.get('mode');
  if (m && plan.modes.includes(m) && m !== 'drill') { setMode(m); applied.push('mode'); }

  const az = parseFloat(params.get('az')), el = parseFloat(params.get('el'));
  if (Number.isFinite(az) && Number.isFinite(el)) {
    const sc = new THREE.Spherical(3, THREE.MathUtils.degToRad(90 - el),
                                      THREE.MathUtils.degToRad(az));
    camera.position.setFromSpherical(sc);
    state.viewDir.copy(camera.position).normalize();
    state.tweening = false;
    camera.lookAt(controls.target);
    for (const b of viewsEl.children) b.setAttribute('aria-pressed', 'false');
    applied.push('view');
  }
  const z = parseFloat(params.get('z'));
  if (Number.isFinite(z) && z > 0) {
    state.userZoom = THREE.MathUtils.clamp(z, 0.2, 8);
    applied.push('zoom');
  }
  const ex = parseFloat(params.get('ex'));
  if (Number.isFinite(ex)) {
    state.targetExplode = state.explode = THREE.MathUtils.clamp(ex, 0, 1);
    $('slider').value = state.explode;
    $('btnParts').setAttribute('aria-pressed', String(state.explode > 0.001));
    applied.push('explode');
  }
  if (params.get('debris') === '1') {
    state.showDebris = true;
    applyDebris();
    $('btnDebris').setAttribute('aria-pressed', 'true');
    applied.push('debris');
  }
  const g = params.get('g');
  if (g && groupIndex[g]) {
    selectGroup(g);
    state.drill = state.targetDrill;      // 直接到位，别让分享出去的链接自己动一下
    const pi = parseInt(params.get('p'), 10);
    if (Number.isFinite(pi)) { setFocus(pi); applied.push('part'); }
    applied.push('group');
  }
  applyTransforms();
  urlReady = true;
  return applied;
}

function flashButton(b, text) {
  const old = b.dataset.label || b.textContent;
  b.dataset.label = old;
  b.textContent = text;
  b.setAttribute('aria-pressed', 'true');
  clearTimeout(b._flash);
  b._flash = setTimeout(() => {
    b.textContent = b.dataset.label;
    b.setAttribute('aria-pressed', 'false');
  }, 1400);
}

// ---------- 拾取与选择 ----------
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
// 位移超过此像素数即判为拖拽旋转，不算点击。触摸比鼠标抖，阈值放宽。
const DRAG_SLOP_MOUSE = 5, DRAG_SLOP_TOUCH = 12;
let downAt = null, hovered = null, lastHoverAt = 0;

// 直接对 147 个 mesh、54 万面做三角形求交实测要 5.7ms/次，悬停时会掉帧。
// 改成两阶段：先用包围盒筛出候选并按入射距离排序，再按序做精确求交，
// 一旦已命中的距离小于下一候选的盒入射距离即可提前结束。
let boxesDirty = true;
const _box = new THREE.Box3(), _pt = new THREE.Vector3(), _m = new THREE.Matrix4();

function buildLocalBoxes() {
  for (const p of parts) {
    p.obj.updateWorldMatrix(true, false);
    const lb = new THREE.Box3();
    for (const mesh of p.meshes) {
      if (!mesh.geometry.boundingBox) mesh.geometry.computeBoundingBox();
      mesh.updateWorldMatrix(true, false);
      _m.copy(p.obj.matrixWorld).invert().multiply(mesh.matrixWorld);
      lb.union(mesh.geometry.boundingBox.clone().applyMatrix4(_m));
    }
    p.localBox = lb;
    p.worldBox = new THREE.Box3();
  }
  boxesDirty = true;
}

function refreshWorldBoxes() {
  for (const p of parts) {
    if (!p.localBox) continue;
    p.obj.updateWorldMatrix(true, false);
    p.worldBox.copy(p.localBox).applyMatrix4(p.obj.matrixWorld);
  }
  boxesDirty = false;
}

function pickAt(clientX, clientY) {
  if (!pickTargets.length) return null;
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((clientX - r.left) / r.width) * 2 - 1,
          -((clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  if (boxesDirty) refreshWorldBoxes();

  const cand = [];
  for (const p of parts) {
    if (!p.worldBox || p.worldBox.isEmpty()) continue;
    if (raycaster.ray.intersectBox(p.worldBox, _pt)) {
      cand.push([raycaster.ray.origin.distanceTo(_pt), p]);
    }
  }
  if (!cand.length) return null;
  cand.sort((a, b) => a[0] - b[0]);

  let best = Infinity, bestKey = null, tested = 0;
  for (const [boxDist, p] of cand) {
    if (boxDist > best) break;          // 后续候选的盒都比已命中更远
    tested++;
    const hits = raycaster.intersectObjects(p.meshes, false);
    if (hits.length && hits[0].distance < best) {
      best = hits[0].distance;
      bestKey = p.groupKey;
    }
  }
  pickAt.lastStats = { candidates: cand.length, tested, total: parts.length };
  return bestKey;
}

function selectGroup(key) {
  if (key && !groupIndex[key]) return;
  if (state.selected === key) return;
  state.selected = key;
  state.targetDrill = key ? 1 : 0;
  state.focus = -1;
  setGhostMode(!!key);
  if (key) indexGroupParts(key);
  computeDrillFraming();
  renderInspector();
  applyTransforms();
  scheduleUrlSync();
}

function computeDrillFraming() {
  const g = state.selected && groupIndex[state.selected];
  if (!g) { state.zoomFitDrill = state.zoomFit; state.targetDrillPos.set(0, 0, 0); return; }
  const lo = g.drillBounds.min, hi = g.drillBounds.max;
  state.zoomFitDrill = fitZoom(lo, hi);
  state.targetDrillPos
    .set((lo[0] + hi[0]) / 2, (lo[1] + hi[1]) / 2, (lo[2] + hi[2]) / 2)
    .sub(currentCenter).multiplyScalar(modelScale);
}

function renderInspector() {
  const el = $('inspect');
  const key = state.selected;
  if (!key) { el.style.display = 'none'; buildRoster(); return; }
  const g = groupIndex[key];
  const list = partsByGroup.get(key) || [];
  const focused = state.focus >= 0 ? list.find((p) => p.focusIndex === state.focus) : null;
  const sideText = { L: 'LEFT', R: 'RIGHT', C: 'CENTER' }[g.side] || g.side;
  $('insName').textContent = g.part.replace(/_/g, ' ').toUpperCase();
  $('insKicker').textContent = `SUBASSEMBLY · ${sideText}`;
  const rows = [
    ['PARTS', g.count],
    ['TRIANGLES', g.tris.toLocaleString()],
    ['HEIGHT', `${(g.hRange[0] * 100).toFixed(0)}–${(g.hRange[1] * 100).toFixed(0)}%`],
  ];
  if (g.emissive) rows.push(['EMISSIVE', `${g.emissive} ACTIVE`]);
  if (focused) {
    rows.length = 0;
    rows.push(['PART', `${state.focus + 1} / ${list.length}`],
              ['NAME', focused.meta.name.slice(0, 18)],
              ['TRIANGLES', focused.meta.tris.toLocaleString()],
              ['MATERIAL', String(focused.meta.material || '—').slice(0, 16)]);
    if (focused.meta.emissive) rows.push(['EMISSIVE', 'ACTIVE']);
  }
  $('insRows').innerHTML =
    rows.map(([k, v]) => `<div class="r"><span>${k}</span>` +
      `<span class="val${k === 'EMISSIVE' ? ' emis' : ''}">${v}</span></div>`).join('') +
    (focused
      ? '<div class="mats">← → 浏览组内零件 · ESC 退出</div>'
      : (g.materials.length
          ? `<div class="mats">MATERIALS<br>${g.materials.join(' · ')}</div>`
            + '<div class="mats">← → 逐件浏览</div>' : ''));
  el.style.display = 'block';
  $('roster').style.display = 'none';
}

renderer.domElement.addEventListener('pointerdown', (e) => {
  downAt = { x: e.clientX, y: e.clientY, touch: e.pointerType !== 'mouse' };
});
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!downAt) return;
  const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y);
  const slop = downAt.touch ? DRAG_SLOP_TOUCH : DRAG_SLOP_MOUSE;
  downAt = null;
  if (moved > slop) return;           // 是拖拽旋转，不是点击
  selectGroup(pickAt(e.clientX, e.clientY));
});
// 单次拾取实测约 3.8ms（两阶段筛选后），连续悬停会顶掉帧预算。
// 光标反馈并不需要高频，改成指针停下来之后再拾取一次。
let hoverTimer = 0;
renderer.domElement.addEventListener('pointermove', (e) => {
  clearTimeout(hoverTimer);
  if (hovered !== null) {
    hovered = null;
    renderer.domElement.classList.remove('pickable');
  }
  if (downAt) return;                    // 正在拖拽旋转，不做拾取
  const { clientX, clientY } = e;
  hoverTimer = setTimeout(() => {
    hovered = pickAt(clientX, clientY);
    renderer.domElement.classList.toggle('pickable', !!hovered);
  }, 120);
});
// 用户一动手就停：否则导览会和人抢控制权
renderer.domElement.addEventListener('pointerdown', () => { if (state.touring) stopTour(); });

addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (state.focus >= 0) setFocus(-1); else selectGroup(null);
    return;
  }
  if (!state.selected) return;
  if (e.key === 'ArrowRight' || e.key === ']') { e.preventDefault(); setFocus(state.focus + 1); }
  if (e.key === 'ArrowLeft' || e.key === '[') { e.preventDefault(); setFocus(state.focus - 1); }
});
$('insClose').onclick = () => selectGroup(null);

function startAssemble() {
  if (!parts.length) return;
  selectGroup(null);
  state.assembling = true;
  state.assembleT = 0;
  state.explode = 1;            // 取景从全爆炸态起步
  state.targetExplode = 0;
  $('slider').value = 0;
  $('btnParts').setAttribute('aria-pressed', 'false');
  $('btnAssemble').setAttribute('aria-pressed', 'true');
  setEmissiveLevel(0);
  applyTransforms();
}

function stopAssemble(complete) {
  state.assembling = false;
  state.assembleT = 0;
  $('btnAssemble').setAttribute('aria-pressed', 'false');
  if (complete) { state.explode = 0; state.targetExplode = 0; }
  setEmissiveLevel(1);
  applyTransforms();
}

// ---------------------------------------------------------------------------
// REPULSOR
//
// 发射口是推导出来的，不是标注的：模型里没有任何「这里是掌心」的语义，
// 只有分好的臂链组。取臂链最远一节的包围盒中心，沿「上一节 -> 这一节」的方向
// 推到该节的最远角点 —— 那就是手掌朝外的那一端。方向也由同一条链给出，
// 所以整套推导与模型姿态无关，手臂是垂着还是抬着都成立。
//
// 视觉上刻意不引入后处理：加 EffectComposer 会改变渲染路径，
// 而 HUD 上的 DRAW CALLS / TRIANGLES 是如实读 renderer.info 的，
// 为了一个特效让那两个读数失真不划算。用叠加混合的 sprite + 点光源 + 光束达成。
let repulsor = null;
const _rbox = new THREE.Box3();
const _rv = new THREE.Vector3();

function glowTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grd.addColorStop(0.00, 'rgba(255,255,255,1)');
  grd.addColorStop(0.22, 'rgba(190,235,255,0.80)');
  grd.addColorStop(1.00, 'rgba(120,200,255,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function disposeRepulsor() {
  if (!repulsor) return;
  for (const s of Object.values(repulsor.sides)) {
    for (const o of [s.glow, s.light, s.beam]) o.removeFromParent();
    s.beam.geometry.dispose();
    s.beam.material.dispose();
    s.glow.material.dispose();
  }
  repulsor.tex.dispose();
  repulsor = null;
}

function buildRepulsor() {
  disposeRepulsor();
  // 换模型时若还在开火，state 不复位就会拿旧零件的 recoilLocal 继续算。
  // 今天触发不了（换模型走整页重载），但一旦改成不重载就是真 bug。
  state.repulsing = false;
  state.repulsorT = 0;
  state.repulsorRecoil = 0;
  state.repulsorSides = [];
  $('btnRepulsor')?.setAttribute('aria-pressed', 'false');
  for (const p of parts) { p.recoilLocal = null; p.recoilScene = null; }
  const g = plan.groups || {};
  const H = plan.height;
  const mid = (b) => new THREE.Vector3((b.min[0] + b.max[0]) / 2,
                                       (b.min[1] + b.max[1]) / 2,
                                       (b.min[2] + b.max[2]) / 2);
  const sides = {};
  for (const side of ['L', 'R']) {
    const chain = ARM_CHAIN.filter((c) => g[`${c}/${side}`]);
    if (!chain.length) continue;
    const distal = chain[chain.length - 1];
    if (distal !== 'hand' && distal !== 'forearm') continue;   // 上臂开火不成立
    const dKey = `${distal}/${side}`;
    const pKey = chain.length > 1 ? `${chain[chain.length - 2]}/${side}`
               : (g['chest/C'] ? 'chest/C' : (g['abdomen/C'] ? 'abdomen/C' : null));
    if (!pKey) continue;
    // groups 里有三套 bounds，bounds 才是装配态；groupBounds / drillBounds 都已被位移
    const dc = mid(g[dKey].bounds), pc = mid(g[pKey].bounds);
    const dirScene = dc.clone().sub(pc);
    if (dirScene.lengthSq() < 1e-9) continue;
    dirScene.normalize();
    // 发射口取末端组沿 dir 投影最远的那个角点，不是几何中心
    const b = g[dKey].bounds;
    let reach = -Infinity;
    for (let i = 0; i < 8; i++) {
      _rv.set((i & 1 ? b.max : b.min)[0], (i & 2 ? b.max : b.min)[1], (i & 4 ? b.max : b.min)[2]);
      reach = Math.max(reach, _rv.sub(dc).dot(dirScene));
    }
    // 场景方向 -> 世界方向。根节点只有缩放与平移，但用两点差值算更稳，
    // 将来若给根加了旋转这里不会悄悄错掉。
    const toWorld = (v) => v.clone().sub(currentCenter).multiplyScalar(modelScale);
    const worldDir = toWorld(dc.clone().add(dirScene)).sub(toWorld(dc)).normalize();
    sides[side] = { side, distal: dKey, proximal: pKey, chain, dirScene, worldDir,
                    reach, emitter: new THREE.Vector3() };
  }
  if (!Object.keys(sides).length) { updateRepulsorButton(); return; }

  const tex = glowTexture();
  const beamLen = BEAM_LEN * H * modelScale;
  for (const s of Object.values(sides)) {
    // toneMapped:false 是关键。渲染器开着 ACESFilmic，叠加上去的 0.5 左右会被
    // 压回灰蓝，实测射流看着像根灰杆子。发光体绕开色调映射才能保住饱和度。
    s.glow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: tex, color: EMISSIVE_COLOR, blending: THREE.AdditiveBlending,
      transparent: true, depthWrite: false, depthTest: false,
      toneMapped: false, opacity: 0 }));
    s.glow.visible = false;
    s.glow.renderOrder = 10;

    // 作用范围压到身高的 0.4：点光源开得太远会把整具装甲照白，
    // 实测 distance=0.9 / intensity=7 时胸口的红色被冲成粉色，读起来像过曝而不是发光。
    s.light = new THREE.PointLight(EMISSIVE_COLOR, 0, H * modelScale * 0.4, 2);
    s.light.visible = false;

    // 沿 +Y 建模再旋到 worldDir。远端扩口而不是收细 —— 等粗的细长圆柱在正交投影下
    // 读起来是根杆子（实测第一版就是这个毛病），扩口才像喷流。
    const geo = new THREE.CylinderGeometry(BEAM_RADIUS * H * modelScale * 1.8,
                                           BEAM_RADIUS * H * modelScale * 0.6,
                                           beamLen, 14, 12, true);
    geo.translate(0, beamLen / 2, 0);
    // 沿长度淡出。叠加混合下「颜色趋于黑」就等于「消失」，所以用顶点色做衰减，
    // 不需要另写着色器。不加这一步远端是一刀切的断面，看着像根实心管子。
    {
      const pos = geo.attributes.position;
      const col = new Float32Array(pos.count * 3);
      for (let i = 0; i < pos.count; i++) {
        const k = Math.pow(Math.max(0, 1 - pos.getY(i) / beamLen), 1.6);
        col[i * 3] = col[i * 3 + 1] = col[i * 3 + 2] = k;
      }
      geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    }
    // 双面：开口圆柱只画一面时没有体积感，两面叠加才像一束气流
    s.beam = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
      color: EMISSIVE_COLOR, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
      vertexColors: true, transparent: true, depthWrite: false,
      toneMapped: false, opacity: 0 }));
    s.beam.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), s.worldDir);
    s.beam.visible = false;
    scene.add(s.glow, s.light, s.beam);
  }
  repulsor = { sides, tex, beamLen };
  updateRepulsorButton();
}

// 时间轴：充能 -> 放电 -> 后坐 -> 余辉。t ∈ [0,1]
const FIRE_AT = 0.42;
function repulsorPhases(t) {
  const charge = THREE.MathUtils.smoothstep(t, 0.02, FIRE_AT);
  const flash = t >= FIRE_AT ? Math.exp(-(t - FIRE_AT) / 0.05) : 0;
  const bt = (t - FIRE_AT) / 0.20;
  const beam = bt >= 0 && bt < 1 ? Math.pow(1 - bt, 1.7) : 0;
  const glow = Math.max(t < FIRE_AT ? charge : charge * Math.exp(-(t - FIRE_AT) / 0.35), flash);
  // 后坐：12% 内甩到峰值，之后指数回落。峰值恰为 1，不需要额外归一化。
  const rt = (t - FIRE_AT) / 0.5;
  const recoil = rt < 0 || rt >= 1 ? 0
    : rt < 0.12 ? rt / 0.12 : Math.exp(-(rt - 0.12) * 4.2);
  return { charge, flash, beam, glow, recoil };
}

function repulsorEmitter(s, out) {
  const list = partsByGroup.get(s.distal) || [];
  _rbox.makeEmpty();
  for (const p of list) if (p.worldBox && !p.worldBox.isEmpty()) _rbox.union(p.worldBox);
  if (_rbox.isEmpty()) return false;
  _rbox.getCenter(out);
  out.addScaledVector(s.worldDir, s.reach * modelScale);
  return true;
}

function updateRepulsorVisuals(ph) {
  if (!repulsor) return;
  if (boxesDirty) refreshWorldBoxes();
  const H = plan.height * modelScale;
  for (const s of Object.values(repulsor.sides)) {
    const on = state.repulsorSides.includes(s.side);
    if (!on) continue;
    if (!repulsorEmitter(s, s.emitter)) continue;
    // 闪光主要靠 sprite 表达，而不是靠点光源提亮整个模型
    const size = H * (0.045 + 0.09 * ph.glow + 0.15 * ph.flash);
    s.glow.position.copy(s.emitter);
    s.glow.scale.setScalar(size);
    s.glow.material.opacity = Math.min(1, ph.glow * 1.15);
    s.glow.visible = ph.glow > 0.004;

    s.light.position.copy(s.emitter);
    s.light.intensity = ph.glow * 0.5 + ph.flash * 1.7;
    s.light.visible = s.light.intensity > 0.01;

    s.beam.position.copy(s.emitter);
    s.beam.material.opacity = ph.beam * 0.8;
    s.beam.visible = ph.beam > 0.004;
  }
}

function hideRepulsorVisuals() {
  if (!repulsor) return;
  for (const s of Object.values(repulsor.sides)) {
    s.glow.visible = s.light.visible = s.beam.visible = false;
  }
}

function startRepulsor(side = 'both') {
  if (!repulsor) return null;
  const want = side === 'both'
    ? Object.keys(repulsor.sides)
    : (repulsor.sides[side] ? [side] : []);
  if (!want.length) return null;
  if (state.assembling) stopAssemble(false);
  state.repulsing = true;
  state.repulsorT = 0;
  state.repulsorRecoil = 0;
  state.repulsorSides = want;
  $('btnRepulsor').setAttribute('aria-pressed', 'true');

  // 预算后坐位移。存两份：场景空间那份给 __verifyManifest 复算期望值，
  // 父节点局部空间那份给 applyTransforms 实际使用 —— 与爆炸向量同一套空间约定。
  const H = plan.height;
  for (const p of parts) { p.recoilLocal = null; p.recoilScene = null; }
  for (const sk of want) {
    const s = repulsor.sides[sk];
    for (const c of s.chain) {
      const atten = RECOIL_ATTEN[c] ?? 0;
      if (!atten) continue;
      for (const p of partsByGroup.get(`${c}/${sk}`) || []) {
        if (!p.toLocal) continue;
        p.recoilScene = s.dirScene.clone().multiplyScalar(-RECOIL_DIST * H * atten);
        p.recoilLocal = p.recoilScene.clone().applyMatrix3(p.toLocal);
      }
    }
  }
  applyTransforms();
  return { sides: want, duration: REPULSOR_SECONDS };
}

function stopRepulsor() {
  state.repulsing = false;
  state.repulsorT = 0;
  state.repulsorRecoil = 0;
  state.repulsorSides = [];
  $('btnRepulsor').setAttribute('aria-pressed', 'false');
  for (const p of parts) { p.recoilLocal = null; p.recoilScene = null; }
  hideRepulsorVisuals();
  applyTransforms();
}

function updateRepulsorButton() {
  const b = $('btnRepulsor');
  if (!b) return;
  const n = repulsor ? Object.keys(repulsor.sides).length : 0;
  b.disabled = n === 0;
  b.title = n
    ? `发射口：${Object.values(repulsor.sides).map((s) => s.distal).join(' / ')}`
    : '该模型的手臂没有分离到小臂以下，无法定出发射口';
}

// ---------------------------------------------------------------------------
// Agent 导览
//
// 页面自身不调用任何 LLM —— 它只暴露命令面。导览做的事情是把一串既定的命令
// 交给同一个命令面执行，并把每一条显示出来。它证明的不是「页面会自己动」，
// 而是「这个场景的每种状态变化都已经是一个可被外部调度的原语」。
//
// 步骤按当前模型现有的组挑选：三个模型的分组差别很大，写死组名会在别的模型上失效。
function tourSteps() {
  const has = (k) => !!groupIndex[k];
  const pick = (...c) => c.find(has) ?? Object.keys(groupIndex)[0] ?? null;
  const torso = pick('chest/C', 'chest/L', 'abdomen/C');
  const steps = [
    { tool: 'setView',        args: { name: 'FRONT' },              wait: 1100 },
    { tool: 'setExplodeMode', args: { mode: 'groupSpread' },        wait: 800 },
    { tool: 'setExplode',     args: { value: 1 },                   wait: 1900 },
    { tool: 'setView',        args: { name: '3/4F' },               wait: 1600 },
  ];
  if (torso) {
    steps.push({ tool: 'focusGroup', args: { key: torso }, wait: 1900 },
               { tool: 'focusPart',  args: { index: 1 },   wait: 1500 },
               { tool: 'focusGroup', args: { key: null },  wait: 1000 });
  }
  steps.push({ tool: 'setExplode',   args: { value: 0 },  wait: 1200 },
             { tool: 'playAssemble', args: {},            wait: ASSEMBLE_SECONDS * 1000 + 400 });
  // 没有发射口的模型（手臂未分离到小臂）就不排这一步，而不是让它抛错
  if (repulsor && Object.keys(repulsor.sides).length) {
    steps.push({ tool: 'playRepulsor', args: {}, wait: REPULSOR_SECONDS * 1000 + 300 });
  }
  return steps;
}

let tourToken = null;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function showTourStep(step, i, n) {
  $('tourKicker').textContent = `AGENT · ${i + 1}/${n}`;
  const a = JSON.stringify(step.args);
  $('tourCmd').textContent = `${step.tool}(${a === '{}' ? '' : a})`;
}

async function startTour() {
  if (state.touring) { stopTour(); return; }
  const steps = tourSteps();
  if (!steps.length) return;
  const token = {};
  tourToken = token;
  state.touring = true;
  $('btnTour').setAttribute('aria-pressed', 'true');
  $('tour').style.display = 'block';
  for (let i = 0; i < steps.length; i++) {
    if (tourToken !== token) return;              // 已被打断
    showTourStep(steps[i], i, steps.length);
    try {
      AGENT_TOOLS[steps[i].tool].run(steps[i].args);
    } catch (e) {
      $('tourCmd').textContent = `${steps[i].tool} —— ${e.message}`;
    }
    // 开了「减少动态效果」时不该被一段两分钟的编排绑住，压缩每步停留
    await sleep(reduceMotion() ? Math.min(steps[i].wait, 450) : steps[i].wait);
  }
  if (tourToken === token) stopTour();
}

function stopTour() {
  tourToken = null;
  state.touring = false;
  $('btnTour').setAttribute('aria-pressed', 'false');
  $('tour').style.display = 'none';
}

// CC-BY 3(a)(1) 要求随作品保留：作者、许可声明与其 URI、指向原作的链接；
// (B) 还要求声明是否改动过 —— 站点分发的是压缩过的几何与贴图，属于有改动。
// 数据全部来自 index.json，页面不硬编码任何作者信息。
// 用 DOM 节点拼而不是 innerHTML：这几段是上游文本，不该有机会被当成标记。
function renderCredit(name) {
  const m = MODEL_INDEX.find((x) => x.slug === name);
  const l1 = $('crLine1'), l2 = $('crLine2');
  l1.textContent = ''; l2.textContent = ''; l1.style.color = '';
  const need = ['author', 'authorUrl', 'license', 'licenseUrl', 'source'];
  const missing = m ? need.filter((k) => !m[k]) : need;
  if (missing.length) {
    // 署名是义务不是装饰：数据缺字段时必须显眼地喊出来，不能静默留白
    l1.style.color = 'var(--accent)';
    l1.textContent = `MODEL CREDIT MISSING: ${missing.join(', ')}`;
    return;
  }
  const link = (href, text) => {
    const a = document.createElement('a');
    a.href = href; a.textContent = text;
    a.target = '_blank'; a.rel = 'noopener noreferrer';
    return a;
  };
  const sep = () => {
    const x = document.createElement('span');
    x.className = 'sep'; x.textContent = '·';
    return x;
  };
  l1.append(`\u201c${m.title || m.name}\u201d by `, link(m.authorUrl, m.author));
  l2.append(link(m.licenseUrl, m.license), sep(), 'MODIFIED (COMPRESSED)',
            sep(), link(m.source, 'SOURCE'), sep(), link('./CREDITS.txt', 'ALL CREDITS'));
}

function buildRoster() {
  const el = $('rosterList');
  const panel = $('roster');
  if (MODEL_INDEX.length < 2) { panel.style.display = 'none'; return; }
  el.innerHTML = '';
  MODEL_INDEX.forEach((m, i) => {
    const row = document.createElement('div');
    row.className = 'item';
    row.setAttribute('aria-current', String(m.slug === slug));
    row.title = `${m.parts} 件 / ${m.groups} 组 / ${m.tris.toLocaleString()} 面`
              + `\n${m.author} · ${m.license}`;
    row.innerHTML =
      `<span class="no">${String(i + 1).padStart(2, '0')}</span>` +
      `<img src="${m.preview}" alt="" loading="lazy">` +
      `<span><span class="nm">${m.name}</span><br>` +
      `<span class="sub">${m.subtitle} · ${m.parts} PARTS</span></span>`;
    if (m.slug !== slug) row.onclick = () => { location.search = `?model=${m.slug}`; };
    el.appendChild(row);
  });
  panel.style.display = 'block';
}

// 模式切换从按钮回调里抽出来：URL 还原要走同一条路径，
// 否则「点按钮」和「按链接进来」两条路会慢慢分叉。
// 设爆炸进度的唯一入口。此前滑块、PARTS 按钮、agent 命令、__setExplode 四条路
// 各写各的，其中只有前两条会回写 URL —— 于是「用 agent 摆好状态再复制链接」
// 拿到的是一条丢了爆炸进度的链接。CI 的运行时验收一上来就撞在这上面。
function setExplodeTarget(v) {
  const x = THREE.MathUtils.clamp(Number(v), 0, 1);
  if (state.assembling) stopAssemble(false);
  state.targetExplode = x;
  $('slider').value = x;
  $('btnParts').setAttribute('aria-pressed', String(x > 0.001));
  scheduleUrlSync();
  return x;
}

function setMode(m) {
  if (!plan.modes.includes(m)) return;
  state.mode = m;
  for (const x of $('modes').children) {
    x.setAttribute('aria-pressed', String(x.textContent === m));
  }
  computeFraming(currentBox, currentCenter);
  applyTransforms();
  scheduleUrlSync();
}

function buildModeButtons() {
  const el = $('modes');
  el.innerHTML = '';
  for (const m of plan.modes.filter((x) => x !== 'drill')) {
    const b = document.createElement('button');
    b.textContent = m;
    b.setAttribute('aria-pressed', String(m === state.mode));
    b.onclick = () => setMode(m);
    el.appendChild(b);
  }
}

addEventListener('resize', () => {
  aspect = innerWidth / innerHeight;
  camera.left = -FRUSTUM * aspect / 2; camera.right = FRUSTUM * aspect / 2;
  camera.top = FRUSTUM / 2; camera.bottom = -FRUSTUM / 2;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- 帧循环 ----------
function renderOnce() { renderer.render(scene, camera); }
window.__renderOnce = renderOnce;
window.__info = () => ({
  triangles: renderer.info.render.triangles,
  calls: renderer.info.render.calls,
  geometries: renderer.info.memory.geometries,
  textures: renderer.info.memory.textures,
});

const sph = new THREE.Spherical();
let frames = 0, fpsT = performance.now(), fps = 0;
const fpsHistory = [];

function tick() {
  requestAnimationFrame(tick);

  // 视角补间
  if (state.tweening) {
    const want = state.viewDir.clone().multiplyScalar(3);
    if (reduceMotion()) { camera.position.copy(want); state.tweening = false; }
    else {
      camera.position.lerp(want, 0.12);
      if (camera.position.distanceTo(want) < 0.002) { camera.position.copy(want); state.tweening = false; }
    }
    camera.lookAt(controls.target);
  }

  // 组装时间轴
  const now0 = performance.now();
  const dt = Math.min((now0 - (tick.last || now0)) / 1000, 0.1);   // 卡顿时钳住步长
  tick.last = now0;

  let dirty = false;
  if (state.assembling && reduceMotion()) {
    // 组装是一段 4.2 秒的编排，属于典型的「非必要动效」，直接给终态
    setEmissiveLevel(1);
    stopAssemble(true);
    dirty = true;
  } else if (state.assembling) {
    state.assembleT += dt / ASSEMBLE_SECONDS;
    // 取景整体从全爆炸收到装配态；位置由 partFactor 各自的时间轴驱动
    state.explode = 1 - THREE.MathUtils.smoothstep(state.assembleT, 0, 1);
    // 收尾 18% 点亮
    setEmissiveLevel(THREE.MathUtils.smoothstep(state.assembleT, 0.82, 1.0));
    dirty = true;
    if (state.assembleT >= 1) stopAssemble(true);
  }

  // REPULSOR 时间轴
  let repulsorPh = null;
  if (state.repulsing) {
    state.repulsorT += dt / REPULSOR_SECONDS;
    if (state.repulsorT >= 1) {
      stopRepulsor();
    } else {
      repulsorPh = repulsorPhases(state.repulsorT);
      // 发光不是前庭刺激源，位移才是：减少动态时保留充能与放电，去掉后坐
      state.repulsorRecoil = reduceMotion() ? 0 : repulsorPh.recoil;
      dirty = true;
    }
  }

  // 爆炸与钻取补间
  if (!state.assembling) {
  if (Math.abs(state.explode - state.targetExplode) > 0.0004) {
    state.explode = reduceMotion() ? state.targetExplode
      : state.explode + (state.targetExplode - state.explode) * 0.1;
    dirty = true;
  }
  }
  if (Math.abs(state.drill - state.targetDrill) > 0.0004) {
    state.drill = reduceMotion() ? state.targetDrill
      : state.drill + (state.targetDrill - state.drill) * 0.12;
    dirty = true;
  }
  if (dirty) { applyTransforms(); updateGhostOpacity(); boxesDirty = true; }
  if (repulsorPh) updateRepulsorVisuals(repulsorPh);

  // 取景两层插值：先按爆炸进度，再按钻取进度收拢到选中组
  const baseZoom = THREE.MathUtils.lerp(state.zoomFit, state.zoomFitFull, state.explode);
  const wantZoom = THREE.MathUtils.lerp(baseZoom, state.zoomFitDrill, state.drill);
  camera.zoom += (wantZoom * state.userZoom - camera.zoom) * 0.12;
  camera.updateProjectionMatrix();
  _a.lerpVectors(state.targetAssembled, state.targetFull, state.explode);
  _a.lerp(state.targetDrillPos, state.drill);
  controls.target.lerp(_a, 0.15);

  controls.update();
  headlight.position.copy(camera.position);
  renderOnce();

  // 遥测
  frames++;
  const now = performance.now();
  if (now - fpsT >= 500) {
    fps = Math.round(frames * 1000 / (now - fpsT));
    frames = 0; fpsT = now;
    fpsHistory.push(fps);
    if (fpsHistory.length > 200) fpsHistory.shift();
    window.__fpsHistory = fpsHistory;
    $('fps').textContent = fps;
    $('tri').textContent = renderer.info.render.triangles.toLocaleString();
    $('dc').textContent = renderer.info.render.calls;
  }
  sph.setFromVector3(camera.position);
  $('az').textContent = (THREE.MathUtils.radToDeg(sph.theta)).toFixed(1) + '°';
  $('el').textContent = (90 - THREE.MathUtils.radToDeg(sph.phi)).toFixed(1) + '°';
  $('zm').textContent = camera.zoom.toFixed(2);
  $('ex').textContent = Math.round(state.explode * 100) + '%';
  $('mo').textContent = state.assembling
    ? `ASSEMBLE ${Math.round(state.assembleT * 100)}%`
    : state.repulsing
      ? `REPULSOR ${Math.round(state.repulsorT * 100)}%` : 'IDLE';
}

// ---------------------------------------------------------------------------
// Agent 工具层
//
// 这个项目最初的命题是「Agent 能把 Web 当作表达介质做到什么程度」。
// 场景的每一种状态变化都已经是一个纯函数式的原语，把它们收成带 schema 的
// 命令集，LLM 就能用自然语言意图驱动这个场景，而不需要懂 Three.js。
//
// 页面自身不调用任何 LLM。它只暴露命令面与 schema；
// 由外部（agent、脚本、控制台）来决定调用序列。
// ---------------------------------------------------------------------------
const AGENT_TOOLS = {
  listModels: {
    描述: '列出可用的装甲模型及其部件与组数',
    参数: {},
    run: () => (MODEL_INDEX.length ? MODEL_INDEX : MODELS.map((s) => ({ slug: s }))),
  },
  loadModel: {
    描述: '切换到指定模型（会重新加载页面）',
    参数: { slug: '模型标识，取自 listModels' },
    run: ({ slug }) => { location.search = `?model=${encodeURIComponent(slug)}`; },
  },
  listGroups: {
    描述: '列出当前模型的所有子装配体及其部件数、三角面数、发光件数',
    参数: {},
    run: () => Object.entries(groupIndex).map(([key, g]) => ({
      key, part: g.part, side: g.side, parts: g.count, tris: g.tris,
      emissive: g.emissive, hRange: g.hRange,
    })),
  },
  setView: {
    描述: '切换正交视角',
    参数: { name: `六选一: ${Object.keys(VIEWS).join(' / ')}` },
    run: ({ name }) => { setView(name); return { view: name }; },
  },
  setExplode: {
    描述: '设置爆炸进度，0 为装配态，1 为完全展开',
    参数: { value: '0 到 1 的小数' },
    run: ({ value }) => ({ explode: setExplodeTarget(value) }),
  },
  setExplodeMode: {
    描述: '切换爆炸算法',
    参数: { mode: `四选一: ${['radial','semantic','group','groupSpread'].join(' / ')}` },
    run: ({ mode }) => { window.__setMode(mode); return { mode }; },
  },
  focusGroup: {
    描述: '钻取某个子装配体：其余幽灵化、该组组内展开、相机对焦',
    参数: { key: '组标识，形如 chest/C，取自 listGroups；传 null 取消' },
    run: ({ key }) => { selectGroup(key ?? null); return { selected: state.selected }; },
  },
  focusPart: {
    描述: '在已钻取的组内聚焦某一个零件',
    参数: { index: '组内序号，从 0 开始；传 -1 取消聚焦' },
    run: ({ index }) => {
      if (!state.selected) throw new Error('先用 focusGroup 选中一个组');
      setFocus(Number(index));
      const list = partsByGroup.get(state.selected) || [];
      const f = list.find((p) => p.focusIndex === state.focus);
      return { index: state.focus, name: f?.meta.name ?? null, tris: f?.meta.tris ?? null };
    },
  },
  playAssemble: {
    描述: '播放组装动画：按穿戴顺序逐组归位，收尾点亮发光件',
    参数: {},
    run: () => { startAssemble(); return { duration: ASSEMBLE_SECONDS }; },
  },
  playRepulsor: {
    描述: '发射掌心射流：充能、放电、手臂后坐。发射口由臂链推导，'
        + '手臂未分离到小臂的一侧不可用',
    参数: { side: "'L' | 'R' | 'both'，默认 both；该侧无发射口时返回 null" },
    run: ({ side } = {}) => {
      const r = startRepulsor(side ?? 'both');
      if (!r) throw new Error(repulsor
        ? `该侧没有发射口，可用：${Object.keys(repulsor.sides).join(', ')}`
        : '当前模型的手臂没有分离到小臂以下，无法定出发射口');
      return r;
    },
  },
  getState: {
    描述: '读取当前场景状态，用于决定下一步',
    参数: {},
    run: () => ({
      model: slug, source: window.__source?.mode ?? null,
      view: [...viewsEl.children].find((b) => b.getAttribute('aria-pressed') === 'true')?.textContent ?? null,
      mode: state.mode, explode: +state.explode.toFixed(3),
      selected: state.selected, focus: state.focus,
      assembling: state.assembling,
      touring: state.touring,
      repulsing: state.repulsing,
      repulsorSides: repulsor ? Object.keys(repulsor.sides) : [],
      azimuth: +THREE.MathUtils.radToDeg(sph.theta).toFixed(1),
      elevation: +(90 - THREE.MathUtils.radToDeg(sph.phi)).toFixed(1),
      groups: Object.keys(groupIndex).length,
    }),
  },
};

// 顺序执行一串命令；每步之间等待，让补间动画走完再进入下一步。
async function runScript(steps) {
  const log = [];
  for (const step of steps) {
    const { tool, args = {}, waitMs = 900 } = step;
    const t = AGENT_TOOLS[tool];
    if (!t) { log.push({ tool, error: '未知命令' }); continue; }
    try {
      log.push({ tool, args, result: t.run(args) ?? null });
    } catch (e) {
      log.push({ tool, args, error: String(e.message || e) });
    }
    if (waitMs) await new Promise((r) => setTimeout(r, waitMs));
  }
  return log;
}

window.armorLab = {
  tools: AGENT_TOOLS,
  call: (tool, args) => AGENT_TOOLS[tool].run(args || {}),
  run: runScript,
  // 给 LLM 用的工具定义，形状对齐常见的 function-calling schema
  schema: () => Object.entries(AGENT_TOOLS).map(([name, t]) => ({
    name, description: t.描述,
    parameters: {
      type: 'object',
      properties: Object.fromEntries(
        Object.entries(t.参数).map(([k, v]) => [k, { type: 'string', description: v }])),
      required: Object.keys(t.参数),
    },
  })),
};

};
window.__state = state;

window.__groups = () => Object.keys(groupIndex);
// 结构指纹只能证明节点没被重排；这里进一步验证运行时按 node 索引取到的
// 对象，确实是 manifest 里记录的那个零件 —— 比对各自的世界包围盒中心。
// 对照用：把各零件绑定的 manifest 记录整体错位 shift 格，模拟 node 索引被打乱。
// 若 __verifyManifest 有效，错位后偏差必须显著变大 —— 否则该校验是空的。
window.__scrambleMeta = (shift = 1) => {
  const metas = parts.map((p) => p.meta);
  const n = metas.length;
  parts.forEach((p, i) => { p.meta = metas[(i + shift) % n]; });
  return n;
};

window.__verifyManifest = () => {
  if (boxesDirty) refreshWorldBoxes();
  const c = new THREE.Vector3();
  let worst = 0, worstName = null, n = 0;
  const devs = [];
  const median = (a) => { const b = [...a].sort((x, y) => x - y);
    return b.length ? b[Math.floor(b.length / 2)] : 0; };
  const H = plan.height;
  for (const p of parts) {
    if (!p.worldBox || p.worldBox.isEmpty()) continue;
    p.worldBox.getCenter(c);
    // manifest 的 center 在模型空间；换算到当前世界空间
    const exp = new THREE.Vector3(...p.meta.center)
      .sub(currentCenter).multiplyScalar(modelScale);
    // 期望位移必须用 plan 里的原始向量（gltf 场景空间），不能用 p.vecLocal ——
    // 后者已被 Matrix3 变换到各自父节点的局部空间，与 meta.center 不同空间。
    // 根节点只有缩放与平移、无旋转，所以场景空间方向乘 modelScale 即为世界空间。
    const entry = plan.parts[String(p.meta.node)];
    const raw = entry?.[state.mode];
    if (raw) {
      const off = new THREE.Vector3(...raw).multiplyScalar(H * state.explode);
      if (state.selected && p.groupKey === state.selected && entry.drill) {
        off.lerp(new THREE.Vector3(...entry.drill).multiplyScalar(H), state.drill);
      }
      exp.addScaledVector(off, modelScale);
    }
    // 后坐也是真实位移，期望值必须含它，否则一开火这个校验就会整片报偏差
    if (state.repulsorRecoil > 0 && p.recoilScene) {
      exp.addScaledVector(p.recoilScene, state.repulsorRecoil * modelScale);
    }
    const d = c.distanceTo(exp) / modelScale / H;   // 以身高为单位
    if (!Number.isFinite(d)) continue;
    devs.push(d);
    if (d > worst) { worst = d; worstName = p.meta.name; }
    n++;
  }
  return { parts: n, maxDeviationInHeights: +worst.toFixed(6),
           medianDeviation: +median(devs).toFixed(6), worstPart: worstName };
};

// 署名的运行时校验。它检查的不是「字符串填进去了」，而是「读者真的看得见」：
// 尺寸、可见性、是否落在视口内，以及三条必需链接的 href 是否与 index.json 一致。
// 对照组见 docs/STATE.md 的「失败必须有声」—— 清空 #credit 后本函数必须报错。
window.__verifyCredit = () => {
  const el = $('credit');
  const st = getComputedStyle(el);
  const r = el.getBoundingClientRect();
  const text = el.textContent.replace(/\s+/g, ' ').trim();
  const hrefs = [...el.querySelectorAll('a')].map((a) => a.getAttribute('href'));
  const m = MODEL_INDEX.find((x) => x.slug === slug) || {};
  const problems = [];

  if (st.display === 'none' || st.visibility === 'hidden' || Number(st.opacity) === 0)
    problems.push('署名块被隐藏');
  if (r.width < 40 || r.height < 10)
    problems.push(`署名块尺寸异常 ${Math.round(r.width)}x${Math.round(r.height)}`);
  if (r.right < 0 || r.left > innerWidth || r.bottom < 0 || r.top > innerHeight)
    problems.push('署名块落在视口外');
  if (/MISSING/.test(text)) problems.push(text);
  if (m.author && !text.includes(m.author)) problems.push('正文里没有作者名');
  if (m.license && !text.includes(m.license)) problems.push('正文里没有许可名');
  if (!/MODIFIED/.test(text)) problems.push('没有声明作品已被改动');
  for (const [k, label] of [['authorUrl', '作者主页'], ['licenseUrl', '许可全文'],
                            ['source', '原始页面']]) {
    if (m[k] && !hrefs.includes(m[k])) problems.push(`缺少${label}链接`);
  }
  return { ok: problems.length === 0, problems, text, hrefs };
};

// HUD 各面板是各自 fixed 定位的，靠手写坐标互相让开 —— 换视口、改字号、
// 多一行内容都可能让它们撞在一起，而撞了并不会报错，只是文字叠在一起还能读一半。
// 这个函数把「没撞」变成可断言的事实。
window.__verifyHud = () => {
  const sel = ['.hd', '#tele', '#ctl', '#roster', '#inspect', '#credit', '#tour'];
  const boxes = [];
  for (const q of sel) {
    const el = document.querySelector(q);
    if (!el) continue;
    const st = getComputedStyle(el);
    if (st.display === 'none' || st.visibility === 'hidden') continue;
    const b = el.getBoundingClientRect();
    if (b.width < 1 || b.height < 1) continue;
    boxes.push([q, b]);
  }
  const hits = [];
  for (let i = 0; i < boxes.length; i++) {
    for (let j = i + 1; j < boxes.length; j++) {
      const [qa, a] = boxes[i], [qb, b] = boxes[j];
      // #credit 在移动端是 #ctl 的流内子节点，父子相含不算冲突
      // #credit / #tour 在移动端是 #ctl 的流内子节点，父子相含不算冲突
      const child = (x) => x === '#credit' || x === '#tour';
      if ((qa === '#ctl' && child(qb)) || (qb === '#ctl' && child(qa))) continue;
      if (a.right <= b.left || b.right <= a.left || a.bottom <= b.top || b.bottom <= a.top) continue;
      hits.push({ pair: `${qa} × ${qb}`,
                  overlap: [Math.round(Math.min(a.right, b.right) - Math.max(a.left, b.left)),
                            Math.round(Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top))] });
    }
  }
  return { viewport: `${innerWidth}x${innerHeight}`,
           panels: boxes.map(([q]) => q), ok: hits.length === 0, overlaps: hits };
};

// 发射口是推导出来的，错了不会报错、只会「光从胳膊肘冒出来」，肉眼还未必看得准。
// 这个函数把推导结果变成可断言的量：发射口必须落在末端组的包围盒附近、
// 必须比该组中心更靠外，且开火峰值时臂链确实发生了位移。
window.__verifyRepulsor = () => {
  if (!repulsor) return { ok: false, problems: ['当前模型没有发射口'], sides: [] };
  if (boxesDirty) refreshWorldBoxes();
  const H = plan.height * modelScale;
  const problems = [];
  const out = [];

  const boxOf = (keys) => {
    const b = new THREE.Box3();
    for (const k of keys) {
      for (const q of partsByGroup.get(k) || []) {
        if (q.worldBox && !q.worldBox.isEmpty()) b.union(q.worldBox);
      }
    }
    return b.isEmpty() ? null : b;
  };
  // 躯干：射流不该打进自己身体，后坐也该把手推离躯干
  const torso = boxOf(['chest/C', 'chest/L', 'chest/R', 'abdomen/C']);
  const torsoC = torso ? torso.getCenter(new THREE.Vector3()) : new THREE.Vector3();

  for (const s of Object.values(repulsor.sides)) {
    const db = boxOf([s.distal]);
    if (!db) { problems.push(`${s.side}: 取不到末端组的世界包围盒`); continue; }
    const c = db.getCenter(new THREE.Vector3());
    const e = new THREE.Vector3();
    if (!repulsorEmitter(s, e)) { problems.push(`${s.side}: 算不出发射口`); continue; }

    // 1) 发射口必须比末端组中心更远离躯干。若 distal / proximal 取反，方向会掉头，
    //    这条立刻失败 —— 它是这套推导里最容易错且最不容易看出来的地方。
    const outward = (e.distanceTo(torsoC) - c.distanceTo(torsoC)) / H;
    if (outward <= 0) {
      problems.push(`${s.side}: 发射口比末端组中心更靠近躯干 (${outward.toFixed(4)}H)，方向可能取反`);
    }
    // 2) 射流不能一出膛就穿过自己的躯干
    if (torso && new THREE.Ray(e.clone(), s.worldDir.clone()).intersectsBox(torso)) {
      problems.push(`${s.side}: 射流方向指向躯干内部`);
    }
    out.push({ side: s.side, distal: s.distal, proximal: s.proximal, chain: s.chain,
               outwardH: +outward.toFixed(4),
               emitter: e.toArray().map((n) => +n.toFixed(4)),
               worldDir: s.worldDir.toArray().map((n) => +n.toFixed(4)) });
  }
  return { ok: problems.length === 0, problems, sides: out,
           firing: state.repulsing, recoil: +state.repulsorRecoil.toFixed(4) };
};

// __verifyRepulsor 的对照组，作用同 __scrambleMeta：证明那个校验不是恒真。
//   'flip'   把发射方向掉头 —— 等价于 distal / proximal 取反
//   'center' 把发射口退回末端组的几何中心 —— 等价于漏掉 reach
//   'restore' 复原
// 每种破坏都必须让 __verifyRepulsor().ok 变成 false。
window.__scrambleRepulsor = (mode = 'flip') => {
  if (!repulsor) return { ok: false, note: '当前模型没有发射口' };
  repulsor._backup ??= Object.fromEntries(Object.entries(repulsor.sides).map(([k, s]) =>
    [k, { worldDir: s.worldDir.clone(), dirScene: s.dirScene.clone(), reach: s.reach }]));
  for (const [k, s] of Object.entries(repulsor.sides)) {
    const b = repulsor._backup[k];
    if (mode === 'flip') { s.worldDir.copy(b.worldDir).negate(); s.dirScene.copy(b.dirScene).negate(); s.reach = b.reach; }
    else if (mode === 'center') { s.worldDir.copy(b.worldDir); s.dirScene.copy(b.dirScene); s.reach = 0; }
    else { s.worldDir.copy(b.worldDir); s.dirScene.copy(b.dirScene); s.reach = b.reach; }
  }
  return { mode, sides: Object.keys(repulsor.sides) };
};

// 开火时臂链到底动了没有。返回每个受影响组在峰值下的位移（单位：身高）。
window.__repulsorRecoilProbe = () => {
  const H = plan.height * modelScale;
  const by = new Map();
  for (const p of parts) {
    if (!p.recoilLocal) continue;
    const d = p.recoilLocal.length() * state.repulsorRecoil * modelScale / H;
    by.set(p.groupKey, Math.max(by.get(p.groupKey) ?? 0, d));
  }
  return { recoil: +state.repulsorRecoil.toFixed(4),
           groups: Object.fromEntries([...by].map(([k, v]) => [k, +v.toFixed(5)])) };
};

// 链接往返的比对基准。真正的检验不在页面内，而是「拿到链接 -> 重载 -> 两次快照相同」，
// 那需要一次真实的页面重载，只有外部测试能做。这里只负责给出可比对的量。
window.__stateSnapshot = () => {
  const sc = new THREE.Spherical().setFromVector3(camera.position);
  return {
    model: slug,
    az: +THREE.MathUtils.radToDeg(sc.theta).toFixed(1),
    el: +(90 - THREE.MathUtils.radToDeg(sc.phi)).toFixed(1),
    zoom: +state.userZoom.toFixed(3),
    explode: +state.targetExplode.toFixed(3),
    mode: state.mode,
    group: state.selected,
    focus: state.focus,
    debris: state.showDebris,
  };
};

// 衬底覆盖检查。HUD 文字压在模型上，靠 .scrim 那几块与背景同色的衬底保证可读性；
// 衬底是写死的尺寸，而面板是内容撑开的 —— 加一个按钮就可能让面板长出衬底之外，
// 而这不会报错，只会让那几个字在幽灵态下变得看不清。加过 LINK / TOUR 后就发生过。
window.__verifyScrim = () => {
  const scrims = [...document.querySelectorAll('.scrim')]
    .filter((e) => getComputedStyle(e).display !== 'none')
    .map((e) => ({ id: e.id, r: e.getBoundingClientRect() }));
  const panels = ['.hd', '#tele', '#ctl', '#roster', '#inspect', '#credit', '#tour'];
  const bad = [];
  const rows = [];
  for (const q of panels) {
    const el = document.querySelector(q);
    if (!el) continue;
    const st = getComputedStyle(el);
    if (st.display === 'none' || st.visibility === 'hidden') continue;
    const r = el.getBoundingClientRect();
    if (r.width < 1 || r.height < 1) continue;
    // 找一块能整个盖住它的衬底。渐变边缘本来就淡，这里只要求落在矩形内。
    const cover = scrims.find((s) => r.left >= s.r.left - 0.5 && r.right <= s.r.right + 0.5
                                  && r.top >= s.r.top - 0.5 && r.bottom <= s.r.bottom + 0.5);
    // 差额要对「最接近能盖住的那块」算，否则会拿不相干的衬底报出个吓人的数字
    const short = (sr) => Math.max(0, r.right - sr.right, r.bottom - sr.bottom,
                                      sr.left - r.left, sr.top - r.top);
    const over = cover ? 0 : Math.min(Infinity, ...scrims.map((x) => short(x.r)));
    rows.push({ panel: q, scrim: cover?.id ?? null, 超出像素: cover ? 0 : Math.round(over) });
    if (!cover) bad.push(`${q} 没有任何一块衬底能盖住（最少超出 ${Math.round(over)}px）`);
  }
  return { viewport: `${innerWidth}x${innerHeight}`, ok: bad.length === 0, problems: bad, rows };
};

window.__debugScene = () => {
  let tris = 0, meshes = 0, hiddenTris = 0, dsTransparent = 0, dsTransTris = 0;
  scene.traverse((n) => {
    if (!n.isMesh || !n.geometry?.index) return;
    const t = n.geometry.index.count / 3;
    let vis = n.visible;
    n.traverseAncestors((a) => { if (!a.visible) vis = false; });
    if (!vis) { hiddenTris += t; return; }
    meshes++; tris += t;
    for (const mm of matList(n)) {
      if (mm.transparent && mm.side === THREE.DoubleSide && !mm.forceSinglePass) {
        dsTransparent++; dsTransTris += t; break;
      }
    }
  });
  return { visibleMeshes: meshes, visibleTris: tris, hiddenTris,
           doubleSidedTransparentMeshes: dsTransparent, theirTris: dsTransTris,
           predictedRenderTris: tris + dsTransTris, reported: renderer.info.render.triangles };
};
window.__pickStats = () => pickAt.lastStats;
window.__pickCost = (n = 200) => {
  const t0 = performance.now();
  for (let i = 0; i < n; i++) pickAt(innerWidth * 0.5, innerHeight * 0.45);
  return +((performance.now() - t0) / n).toFixed(3);
};
</script>
</body>
</html>
