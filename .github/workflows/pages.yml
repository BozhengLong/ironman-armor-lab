name: Build & Deploy Pages

# push 只做构建与校验，不发布 —— 发布必须手动触发。
# 仓库与站点现在都是公开的：仓库可见性本来就保护不了模型，一旦部署，
# GLB 就能被任何人下载。发布仍然要手动确认，因为每次发布都是一次对外分发行为，
# 署名与来源必须是当时想清楚过的状态。
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: '发布到 Pages（站点将公开可访问）'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci
      - run: pip install numpy

      # 资源不入库，按 assets.lock.json 的哈希缓存 —— 锁文件变了才重新下载
      - name: 缓存 3D 资源
        id: assets-cache
        uses: actions/cache@v4
        with:
          path: assets/raw
          key: assets-${{ hashFiles('assets/assets.lock.json') }}

      - name: 下载 3D 资源
        if: steps.assets-cache.outputs.cache-hit != 'true'
        env:
          SKETCHFAB_TOKEN: ${{ secrets.SKETCHFAB_TOKEN }}
        run: |
          if [ -z "$SKETCHFAB_TOKEN" ]; then
            echo "::error::缺少 SKETCHFAB_TOKEN secret，且资源缓存未命中，无法获取模型。"
            echo "::error::设置方式: gh secret set SKETCHFAB_TOKEN"
            exit 1
          fi
          python3 scripts/fetch_models.py

      # 无论走缓存还是新下载，都按锁文件校验字节一致
      - name: 校验资源校验和
        run: python3 scripts/fetch_models.py --verify

      - name: 回归测试
        run: npm test

      - name: 重算部件与爆炸规划并检查与入库版本一致
        run: |
          python3 scripts/analyze_parts.py assets/raw/hulkbuster/scene.gltf
          python3 scripts/analyze_parts.py assets/raw/ironman/scene.gltf
          python3 scripts/analyze_parts.py assets/raw/samurai/scene.gltf
          python3 scripts/explode_plan.py assets/manifests/hulkbuster.json
          python3 scripts/explode_plan.py assets/manifests/ironman.json
          python3 scripts/explode_plan.py assets/manifests/samurai.json
          if ! git diff --quiet -- assets/manifests; then
            echo "::error::重算结果与入库的 manifest 不一致："
            git diff --stat -- assets/manifests
            exit 1
          fi
          echo "manifest 可复现 ✓"

      - name: 压缩资源
        run: node scripts/compress_models.mjs

      - name: 组装站点
        run: node scripts/build_site.mjs

      # 页面的 JS 此前从头到尾没有任何一步解析过：实测往 applyTransforms 注入一个
      # 必然白屏的语法错误，npm test 与 build_site.mjs 双双退出码 0，CI 全绿。
      # check_page.mjs（已并入 npm test）挡住白屏；下面这步再往前一层 ——
      # 在真实浏览器里跑页面自带的五个 __verify* 钩子，并且验证它们确实能失败。
      - name: 安装无头浏览器
        run: npx playwright install --with-deps chromium

      - name: 站点运行时验收
        run: npm run test:page

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # 仅手动触发且勾选 deploy 时才发布
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
